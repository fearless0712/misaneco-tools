</g>
<line x1="360" y1="80" x2="360" y2="320" stroke="#888" stroke-width="4" stroke-dasharray="10 8"/>
<text x="360" y="345" font-size="22" fill="#666" text-anchor="middle">鏡</text>
<text x="170" y="345" font-size="24" fill="#333" text-anchor="middle">もとの分子</text>
<text x="550" y="345" font-size="24" fill="#333" text-anchor="middle">鏡に映した分子</text>
<text x="360" y="388" font-size="21" fill="#333" text-anchor="middle">材料（A〜D）は同じ。でも、どう回しても重ならない（模式図）</text>
