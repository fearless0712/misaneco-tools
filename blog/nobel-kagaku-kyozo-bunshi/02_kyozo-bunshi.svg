<line x1="170" y1="200" x2="170" y2="110"/><line x1="170" y1="200" x2="95" y2="250"/><line x1="170" y1="200" x2="245" y2="250"/><line x1="170" y1="200" x2="200" y2="280"/>
<line x1="550" y1="200" x2="550" y2="110"/><line x1="550" y1="200" x2="625" y2="250"/><line x1="550" y1="200" x2="475" y2="250"/><line x1="550" y1="200" x2="520" y2="280"/>
</g>
<g font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">
<circle cx="170" cy="110" r="26" fill="#c0392b"/><text x="170" y="118">A</text>
<circle cx="95" cy="250" r="26" fill="#214f78"/><text x="95" y="258">B</text>
<circle cx="245" cy="250" r="26" fill="#e0a800"/><text x="245" y="258">C</text>
<circle cx="200" cy="285" r="30" fill="#4f8a5b"/><text x="200" y="293">D</text>
<circle cx="170" cy="200" r="22" fill="#777"/>
