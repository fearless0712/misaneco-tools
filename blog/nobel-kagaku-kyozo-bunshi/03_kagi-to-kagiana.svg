<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" font-family="Hiragino Sans, sans-serif"><rect width="720" height="405" fill="#ffffff"/>
<text x="360" y="42" font-size="26" font-weight="bold" fill="#214f78" text-anchor="middle">カギとカギ穴のたとえ</text>
<rect x="40" y="90" width="200" height="220" rx="16" fill="#e8e8e8" stroke="#666" stroke-width="3"/>
<path d="M110 140 h70 v40 h-30 v90 h-40 z" fill="#ffffff" stroke="#666" stroke-width="3"/>
<text x="140" y="345" font-size="22" fill="#333" text-anchor="middle">カギ穴（体の中）</text>
<g transform="translate(330 110)">
<path d="M0 0 h70 v40 h-30 v90 h-40 z" fill="#e0a800" stroke="#8a6a00" stroke-width="3"/>
<text x="35" y="160" font-size="22" fill="#333" text-anchor="middle">カギ①</text>
<text x="35" y="200" font-size="26" fill="#214f78" text-anchor="middle" font-weight="bold">○ 合う</text>
</g>
<g transform="translate(540 110)">
<path d="M70 0 h-70 v40 h30 v90 h40 z" fill="#e0a800" stroke="#8a6a00" stroke-width="3"/>
<text x="35" y="160" font-size="22" fill="#333" text-anchor="middle">カギ②（鏡うつし）</text>
<text x="35" y="200" font-size="26" fill="#c0392b" text-anchor="middle" font-weight="bold">✕ 合わない</text>
</g>
<text x="360" y="388" font-size="21" fill="#333" text-anchor="middle">形が鏡うつしだと、片方しかはまらない（ノーベル財団のたとえ）</text>
</svg>
