<aside class="noprint" aria-label="広告・PR" style="margin:0 20px 20px;padding:12px 16px;background:#fff;border:1px solid #d6dde8;border-radius:8px;text-align:center;font-size:12px;color:#5d6878"><div style="margin-bottom:6px">広告・PR（アフィリエイトリンクを含みます）</div><a href="https://px.a8.net/svt/ejp?a8mat=4BEK9L+5CX82+4JGQ+5ZEMP" rel="nofollow sponsored noopener" target="_blank"><img width="300" height="250" alt="マネーフォワード クラウド会計" src="https://www26.a8.net/svt/bgt?aid=261019929009&amp;wid=001&amp;eno=01&amp;mid=s00000021185001005000&amp;mc=1" loading="lazy" style="max-width:100%;height:auto;border:0"></a><img width="1" height="1" alt="" src="https://www17.a8.net/0.gif?a8mat=4BEK9L+5CX82+4JGQ+5ZEMP" style="border:0"></aside>
<script>const DATA={"futsu_hosho": {"title": "賃貸住宅標準契約書", "type": "普通借家", "guarantee": "連帯保証人", "word": "https://www.mlit.go.jp/common/001479793.docx", "pdf": "https://www.mlit.go.jp/common/001479827.pdf", "page": "https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000023.html", "articles": [{"kind": "head", "text": "（契約の締結）"}, {"kind": "p", "text": "第１条　貸主（以下「甲」という。）及び借主（以下「乙」という。）は、頭書（１）に記載する賃貸借の目的物（以下「本物件」という。）について、以下の条項により賃貸借契約（以下「本契約」という。）を締結した。"}, {"kind": "head", "text": "（契約期間及び更新）"}, {"kind": "p", "text": "第２条　契約期間は、頭書（２）に記載するとおりとする。"}, {"kind": "p", "text": "２　甲及び乙は、協議の上、本契約を更新することができる。"}, {"kind": "head", "text": "（使用目的）"}, {"kind": "p", "text": "第３条　乙は、居住のみを目的として本物件を使用しなければならない。"}, {"kind": "head", "text": "（賃料）"}, {"kind": "p", "text": "第４条　乙は、頭書（３）の記載に従い、賃料を甲に支払わなければならない。"}, {"kind": "p", "text": "２　１か月に満たない期間の賃料は、１か月を30日として日割計算した額とする。"}, {"kind": "p", "text": "３　甲及び乙は、次の各号の一に該当する場合には、協議の上、賃料を改定することができる。"}, {"kind": "p", "text": "一　土地又は建物に対する租税その他の負担の増減により賃料が不相当となった場合"}, {"kind": "p", "text": "二　土地又は建物の価格の上昇又は低下その他の経済事情の変動により賃料が不相当となった場合"}, {"kind": "p", "text": "三　近傍同種の建物の賃料に比較して賃料が不相当となった場合"}, {"kind": "head", "text": "（共益費）"}, {"kind": "p", "text": "第５条　乙は、階段、廊下等の共用部分の維持管理に必要な光熱費、上下水道使用料、清掃費等（以下この条において「維持管理費」という。）に充てるため、共益費を甲に支払うものとする。"}, {"kind": "p", "text": "２　前項の共益費は、頭書（３）の記載に従い、支払わなければならない。"}, {"kind": "p", "text": "３　１か月に満たない期間の共益費は、１か月を30日として日割計算した額とする。"}, {"kind": "p", "text": "４　甲及び乙は、維持管理費の増減により共益費が不相当となったときは、協議の上、共益費を改定することができる。"}, {"kind": "head", "text": "（敷金）"}, {"kind": "p", "text": "第６条　乙は、本契約から生じる債務の担保として、頭書（３）に記載する敷金を甲に交付するものとする。"}, {"kind": "p", "text": "２　甲は、乙が本契約から生じる債務を履行しないときは、敷金をその債務の弁済に充てることができる。この場合において、乙は、本物件を明け渡すまでの間、敷金をもって当該債務の弁済に充てることを請求することができない。"}, {"kind": "p", "text": "３　甲は、本物件の明渡しがあったときは、遅滞なく、敷金の全額を乙に返還しなければならない。ただし、本物件の明渡し時に、賃料の滞納、第15条に規定する原状回復に要する費用の未払いその他の本契約から生じる乙の債務の不履行が存在する場合には、甲は、当該債務の額を敷金から差し引いた額を返還するものとする。"}, {"kind": "p", "text": "４　前項ただし書の場合には、甲は、敷金から差し引く債務の額の内訳を乙に明示しなければならない。"}, {"kind": "head", "text": "（反社会的勢力の排除）"}, {"kind": "p", "text": "第７条　甲及び乙は、それぞれ相手方に対し、次の各号の事項を確約する。"}, {"kind": "p", "text": "一　自らが、暴力団、暴力団関係企業、総会屋若しくはこれらに準ずる者又はその構成員（以下総称して「反社会的勢力」という。）ではないこと。"}, {"kind": "p", "text": "二　自らの役員（業務を執行する社員、取締役、執行役又はこれらに準ずる者をいう。）が反社会的勢力ではないこと。"}, {"kind": "p", "text": "三　反社会的勢力に自己の名義を利用させ、この契約を締結するものでないこと。"}, {"kind": "p", "text": "四　自ら又は第三者を利用して、次の行為をしないこと。"}, {"kind": "p", "text": "ア　相手方に対する脅迫的な言動又は暴力を用いる行為"}, {"kind": "p", "text": "イ　偽計又は威力を用いて相手方の業務を妨害し、又は信用を毀損する行為"}, {"kind": "p", "text": "２　乙は、甲の承諾の有無にかかわらず、本物件の全部又は一部につき、反社会的勢力に賃借権を譲渡し、又は転貸してはならない。"}, {"kind": "head", "text": "（禁止又は制限される行為）"}, {"kind": "p", "text": "第８条　乙は、甲の書面による承諾を得ることなく、本物件の全部又は一部につき、賃借権を譲渡し、又は転貸してはならない。"}, {"kind": "p", "text": "２　乙は、甲の書面による承諾を得ることなく、本物件の増築、改築、移転、改造若しくは模様替又は本物件の敷地内における工作物の設置を行ってはならない。"}, {"kind": "p", "text": "３　乙は、本物件の使用に当たり、別表第１に掲げる行為を行ってはならない。"}, {"kind": "p", "text": "４　乙は、本物件の使用に当たり、甲の書面による承諾を得ることなく、別表第２に掲げる行為を行ってはならない。"}, {"kind": "p", "text": "５　乙は、本物件の使用に当たり、別表第３に掲げる行為を行う場合には、甲に通知しなければならない。"}, {"kind": "head", "text": "（契約期間中の修繕）"}, {"kind": "p", "text": "第９条　甲は、乙が本物件を使用するために必要な修繕を行わなければならない。この場合の修繕に要する費用については、乙の責めに帰すべき事由により必要となったものは乙が負担し、その他のものは甲が負担するものとする。"}, {"kind": "p", "text": "２　前項の規定に基づき甲が修繕を行う場合は、甲は、あらかじめ、その旨を乙に通知しなければならない。この場合において、乙は、正当な理由がある場合を除き、当該修繕の実施を拒否することができない。"}, {"kind": "p", "text": "３　乙は、本物件内に修繕を要する箇所を発見したときは、甲にその旨を通知し修繕の必要について協議するものとする。"}, {"kind": "p", "text": "４　前項の規定による通知が行われた場合において、修繕の必要が認められるにもかかわらず、甲が正当な理由なく修繕を実施しないときは、乙は自ら修繕を行うことができる。この場合の修繕に要する費用については、第１項に準ずるものとする。"}, {"kind": "p", "text": "５　乙は、別表第４に掲げる修繕について、第１項に基づき甲に修繕を請求するほか、自ら行うことができる。乙が自ら修繕を行う場合においては、修繕に要する費用は乙が負担するものとし、甲への通知及び甲の承諾を要しない。"}, {"kind": "head", "text": "（契約の解除）"}, {"kind": "p", "text": "第10条　甲は、乙が次に掲げる義務に違反した場合において、甲が相当の期間を定めて当該義務の履行を催告したにもかかわらず、その期間内に当該義務が履行されないときは、本契約を解除することができる。"}, {"kind": "p", "text": "一　第４条第１項に規定する賃料支払義務"}, {"kind": "p", "text": "二　第５条第２項に規定する共益費支払義務"}, {"kind": "p", "text": "三　前条第１項後段に規定する乙の費用負担義務"}, {"kind": "p", "text": "２　甲は、乙が次に掲げる義務に違反した場合において、甲が相当の期間を定めて当該義務の履行を催告したにもかかわらず、その期間内に当該義務が履行されずに当該義務違反により本契約を継続することが困難であると認められるに至ったときは、本契約を解除することができる。"}, {"kind": "p", "text": "一　第３条に規定する本物件の使用目的遵守義務"}, {"kind": "p", "text": "二　第８条各項に規定する義務（同条第３項に規定する義務のうち、別表第１第六号から第八号に掲げる行為に係るものを除く。）"}, {"kind": "p", "text": "三　その他本契約書に規定する乙の義務"}, {"kind": "p", "text": "３　甲又は乙の一方について、次のいずれかに該当した場合には、その相手方は、何らの催告も要せずして、本契約を解除することができる。"}, {"kind": "p", "text": "一　第７条第１項各号の確約に反する事実が判明した場合"}, {"kind": "p", "text": "二　契約締結後に自ら又は役員が反社会的勢力に該当した場合"}, {"kind": "p", "text": "４　甲は、乙が第７条第２項に規定する義務に違反した場合又は別表第１第六号から第八号に掲げる行為を行った場合には、何らの催告も要せずして、本契約を解除することができる。"}, {"kind": "head", "text": "（乙からの解約）"}, {"kind": "p", "text": "第11条　乙は、甲に対して少なくとも30日前に解約の申入れを行うことにより、本契約を解約することができる。"}, {"kind": "p", "text": "２　前項の規定にかかわらず、乙は、解約申入れの日から30日分の賃料（本契約の解約後の賃料相当額を含む。）を甲に支払うことにより、解約申入れの日から起算して30日を経過する日までの間、随時に本契約を解約することができる。"}, {"kind": "head", "text": "（一部滅失等による賃料の減額等）"}, {"kind": "p", "text": "第12条　本物件の一部が滅失その他の事由により使用できなくなった場合において、それが乙の責めに帰することができない事由によるものであるときは、賃料は、その使用できなくなった部分の割合に応じて、減額されるものとする。この場合において、甲及び乙は、減額の程度、期間その他必要な事項について協議するものとする。"}, {"kind": "p", "text": "２　本物件の一部が滅失その他の事由により使用できなくなった場合において、残存する部分のみでは乙が賃借をした目的を達することができないときは、乙は、本契約を解除することができる。"}, {"kind": "head", "text": "（契約の終了）"}, {"kind": "p", "text": "第13条　本契約は、本物件の全部が滅失その他の事由により使用できなくなった場合には、これによって終了する。"}, {"kind": "head", "text": "（明渡し）"}, {"kind": "p", "text": "第14条　乙は、本契約が終了する日までに（第10条の規定に基づき本契約が解除された場合にあっては、直ちに）、本物件を明け渡さなければならない。"}, {"kind": "p", "text": "２　乙は、前項の明渡しをするときには、明渡し日を事前に甲に通知しなければならない。"}, {"kind": "head", "text": "（明渡し時の原状回復）"}, {"kind": "p", "text": "第15条　乙は、通常の使用に伴い生じた本物件の損耗及び本物件の経年変化を除き、本物件を原状回復しなければならない。ただし、乙の責めに帰することができない事由により生じたものについては、原状回復を要しない。"}, {"kind": "p", "text": "２　甲及び乙は、本物件の明渡し時において、契約時に特約を定めた場合は当該特約を含め、別表第５の規定に基づき乙が行う原状回復の内容及び方法について協議するものとする。"}, {"kind": "head", "text": "（立入り）"}, {"kind": "p", "text": "第16条　甲は、本物件の防火、本物件の構造の保全その他の本物件の管理上特に必要があるときは、あらかじめ乙の承諾を得て、本物件内に立ち入ることができる。"}, {"kind": "p", "text": "２　乙は、正当な理由がある場合を除き、前項の規定に基づく甲の立入りを拒否することはできない。"}, {"kind": "p", "text": "３　本契約終了後において本物件を賃借しようとする者又は本物件を譲り受けようとする者が下見をするときは、甲及び下見をする者は、あらかじめ乙の承諾を得て、本物件内に立ち入ることができる。"}, {"kind": "p", "text": "４　甲は、火災による延焼を防止する必要がある場合その他の緊急の必要がある場合においては、あらかじめ乙の承諾を得ることなく、本物件内に立ち入ることができる。この場合において、甲は、乙の不在時に立ち入ったときは、立入り後その旨を乙に通知しなければならない。"}, {"kind": "head", "text": "（連帯保証人）"}, {"kind": "p", "text": "第17条　連帯保証人（以下「丙」という。）は、乙と連帯して、本契約から生じる乙の債務を負担するものとする。本契約が更新された場合においても、同様とする。"}, {"kind": "p", "text": "２　前項の丙の負担は、頭書（６）及び記名押印欄に記載する極度額を限度とする。"}, {"kind": "p", "text": "３　丙が負担する債務の元本は、乙又は丙が死亡したときに、確定するものとする。"}, {"kind": "p", "text": "４　丙の請求があったときは、甲は、丙に対し、遅滞なく、賃料及び共益費等の支払状況や滞納金の額、損害賠償の額等、乙の全ての債務の額等に関する情報を提供しなければならない。"}, {"kind": "head", "text": "（協議）"}, {"kind": "p", "text": "第18条　甲及び乙は、本契約書に定めがない事項及び本契約書の条項の解釈について疑義が生じた場合は、民法その他の法令及び慣行に従い、誠意をもって協議し、解決するものとする。"}, {"kind": "head", "text": "（特約条項）"}, {"kind": "p", "text": "第19条　第18条までの規定以外に、本契約の特約については、下記のとおりとする。"}], "beppyo": [{"title": "別表第１（第８条第３項関係）", "lines": ["一　銃砲、刀剣類又は爆発性、発火性を有する危険な物品等を製造又は保管すること。", "二　大型の金庫その他の重量の大きな物品等を搬入し、又は備え付けること。", "三　排水管を腐食させるおそれのある液体を流すこと。", "四　大音量でテレビ、ステレオ等の操作、ピアノ等の演奏を行うこと。", "五　猛獣、毒蛇等の明らかに近隣に迷惑をかける動物を飼育すること。", "六　本物件を、反社会的勢力の事務所その他の活動の拠点に供すること。", "七　本物件又は本物件の周辺において、著しく粗野若しくは乱暴な言動を行い、又は威勢を示すことにより、付近の住民又は通行人に不安を覚えさせること。", "八　本物件に反社会的勢力を居住させ、又は反復継続して反社会的勢力を出入りさせること。"]}, {"title": "別表第２（第８条第４項関係）", "lines": ["一　階段、廊下等の共用部分に物品を置くこと。", "二　階段、廊下等の共用部分に看板、ポスター等の広告物を掲示すること。", "三　観賞用の小鳥、魚等であって明らかに近隣に迷惑をかけるおそれのない動物以外の犬、猫等の動物（別表第１第五号に掲げる動物を除く。）を飼育すること。"]}, {"title": "別表第３（第８条第５項関係）", "lines": ["一　頭書（５）に記載する同居人に新たな同居人を追加（出生を除く。）すること。", "二　１か月以上継続して本物件を留守にすること。"]}, {"title": "別表第４（第９条第５項関係）", "lines": ["ヒューズの取替え", "蛇口のパッキン、コマの取替え", "風呂場等のゴム栓、鎖の取替え", "電球、蛍光灯の取替え", "その他費用が軽微な修繕"]}], "beppyo5": "<div class=\"kb\"><p>【原状回復の条件について】</p><p>本物件の原状回復条件は、下記Ⅱの「例外としての特約」による以外は、賃貸住宅の原状回復に関する費用負担の一般原則の考え方によります。すなわち、</p><p>・　借主の故意・過失、善管注意義務違反、その他通常の使用方法を超えるような使用による損耗等については、借主が負担すべき費用となる。なお、震災等の不可抗力による損耗、上階の居住者など借主と無関係な第三者がもたらした損耗等については、借主が負担すべきものではない。</p><p>・　建物・設備等の自然的な劣化・損耗等（経年変化）及び借主の通常の使用により生ずる損耗等（通常損耗）については、貸主が負担すべき費用となる</p><p>ものとします。</p><p>その具体的内容は、国土交通省の「原状回復をめぐるトラブルとガイドライン（再改訂版）」において定められた別表１及び別表２のとおりですが、その概要は、下記Ⅰのとおりです。</p><p>Ⅰ　本物件の原状回復条件</p><p>（ただし、民法第90条並びに消費者契約法第８条、第８条の２、第９条及び第10条に反しない内容に関して、下記Ⅱの「例外としての特約」の合意がある場合は、その内容によります。）</p><p>　１　貸主・借主の修繕分担表</p><table class=\"kt\"><tr><td><p>貸主の負担となるもの</p></td><td><p>借主の負担となるもの</p></td></tr><tr><td colspan=\"2\"><p>【床（畳・フローリング・カーペットなど）】</p></td></tr><tr><td><p>１．畳の裏返し、表替え（特に破損してないが、次の入居者確保のために行うもの）</p><p>２．フローリングのワックスがけ</p><p>３．家具の設置による床、カーペットのへこみ、設置跡</p><p>４．畳の変色、フローリングの色落ち（日照、建物構造欠陥による雨漏りなどで発生したもの）</p></td><td><p>1. カーペットに飲み物等をこぼしたことによるシミ、カビ（こぼした後の手入れ不足等の場合）</p><p>2. 冷蔵庫下のサビ跡（サビを放置し、床に汚損等の損害を与えた場合）</p><p>3. 引越作業等で生じた引っかきキズ</p><p>4. フローリングの色落ち（借主の不注意で雨が吹き込んだことなどによるもの）</p></td></tr><tr><td colspan=\"2\"><p>【壁、天井（クロスなど）】</p></td></tr><tr><td><p>１．テレビ、冷蔵庫等の後部壁面の黒ずみ（いわゆる電気ヤケ）</p><p>２．壁に貼ったポスターや絵画の跡</p><p>３．壁等の画鋲、ピン等の穴（下地ボードの張替えは不要な程度のもの）</p><p>４．エアコン（借主所有）設置による壁のビス穴、跡</p><p>５．クロスの変色（日照などの自然現象によるもの）</p></td><td><p>１．借主が日常の清掃を怠ったための台所の油汚れ（使用後の手入れが悪く、ススや油が付着している場合）</p><p>２．借主が結露を放置したことで拡大したカビ、シミ（貸主に通知もせず、かつ、拭き取るなどの手入れを怠り、壁等を腐食させた場合）</p><p>３．クーラーから水漏れし、借主が放置したため壁が腐食</p><p>４．タバコ等のヤニ、臭い（喫煙等によりクロス等が変色したり、臭いが付着している場合）</p><p>５．壁等のくぎ穴、ネジ穴（重量物をかけるためにあけたもので、下地ボードの張替えが必要な程度のもの）</p><p>６．借主が天井に直接つけた照明器具の跡</p><p>７．落書き等の故意による毀損</p></td></tr><tr><td colspan=\"2\"><p>【建具等、襖、柱等】</p></td></tr><tr><td><p>１．網戸の張替え（特に破損はしてないが、次の入居者確保のために行うもの）</p><p>２．地震で破損したガラス</p><p>３．網入りガラスの亀裂（構造により自然に発生したもの）</p></td><td><p>１．飼育ペットによる柱等のキズ、臭い（ペットによる柱、クロス等にキズが付いたり、臭いが付着している場合）</p><p>２．落書き等の故意による毀損</p></td></tr><tr><td colspan=\"2\"><p>【設備、その他】</p></td></tr><tr><td><p>１．専門業者による全体のハウスクリーニング（借主が通常の清掃を実施している場合）</p><p>２．エアコンの内部洗浄（喫煙等の臭いなどが付着していない場合）</p><p>３．消毒（台所・トイレ）</p><p>４．浴槽、風呂釜等の取替え（破損等はしていないが、次の入居者確保のために行うもの）</p><p>５．鍵の取替え（破損、鍵紛失のない場合）</p><p>６．設備機器の故障、使用不能（機器の寿命によるもの）</p></td><td><p>１．ガスコンロ置き場、換気扇等の油汚れ、すす（借主が清掃・手入れを怠った結果汚損が生じた場合）</p><p>２．風呂、トイレ、洗面台の水垢、カビ等（借主が清掃・手入れを怠った結果汚損が生じた場合）</p><p>３．日常の不適切な手入れ又は用法違反による設備の毀損</p><p>４．鍵の紛失又は破損による取替え</p><p>５．戸建賃貸住宅の庭に生い茂った雑草</p></td></tr></table></div><div class=\"kb\"><p>　２　借主の負担単位</p><table class=\"kt\"><tr><td colspan=\"2\"><p>負担</p><p>内容</p></td><td colspan=\"2\"><p>借主の負担単位</p></td><td><p>経過年数等の考慮</p></td></tr><tr><td rowspan=\"3\"><p>床</p></td><td rowspan=\"3\"><p>毀損部分の補修</p></td><td><p>畳</p></td><td><p>原則一枚単位</p><p>毀損部分が複数枚の場合はその枚数分（裏返しか表替えかは、毀損の程度による）</p></td><td><p>（畳表）</p><p>経過年数は考慮しない。</p></td></tr><tr><td><p>カーペット</p><p>クッションフロア</p></td><td><p>毀損等が複数箇所の場合は、居室全体</p></td><td><p>（畳床・カーペット・クッションフロア）</p><p>６年で残存価値１円となるような負担割合を算定する。</p></td></tr><tr><td><p>フローリング</p></td><td><p>原則㎡単位</p><p>毀損等が複数箇所の場合は、居室全体</p></td><td><p>（フローリング）</p><p>補修は経過年数を考慮しない。</p><p>（フローリング全体にわたる毀損等があり、張り替える場合は、当該建物の耐用年数で残存価値１円となるような負担割合を算定する。）</p></td></tr><tr><td rowspan=\"2\"><p>壁・天井(クロス)</p></td><td rowspan=\"2\"><p>毀損部分の補修</p></td><td><p>壁（クロス）</p></td><td><p>㎡単位が望ましいが、借主が毀損した箇所を含む一面分までは張替え費用を借主負担としてもやむをえないとする。</p></td><td rowspan=\"2\"><p>（壁〔クロス〕）</p><p>６年で残存価値１円となるような負担割合を算定する。</p></td></tr><tr><td><p>タバコ等の</p><p>ヤニ、臭い</p></td><td><p>喫煙等により当該居室全体においてクロス等がヤニで変色したり臭いが付着した場合のみ、居室全体のクリーニング又は張替え費用を借主負担とすることが妥当と考えられる。</p></td></tr><tr><td rowspan=\"2\"><p>建具・柱</p></td><td rowspan=\"2\"><p>毀損部分</p><p>の補修</p></td><td><p>襖</p></td><td><p>１枚単位</p></td><td><p>（襖紙、障子紙）</p><p>経過年数は考慮しない。</p></td></tr><tr><td><p>柱</p></td><td><p>１本単位</p></td><td><p>（襖、障子等の建具部分、柱）</p><p>経過年数は考慮しない。</p></td></tr><tr><td rowspan=\"3\"><p>設備・その他</p></td><td><p>設備の</p><p>補修</p></td><td><p>設備機器</p></td><td><p>補修部分、交換相当費用</p></td><td><p>（設備機器）</p><p>耐用年数経過時点で残存価値１円となるような直線(又は曲線)を想定し、負担割合を算定する。</p></td></tr><tr><td><p>鍵の</p><p>返却</p></td><td><p>鍵</p></td><td><p>補修部分</p><p>紛失の場合は、シリンダーの交換も含む。</p></td><td><p>鍵の紛失の場合は、経過年数は考慮しない。交換費用相当分を借主負担とする。</p></td></tr><tr><td><p>通常の</p><p>清掃※</p></td><td><p>クリーニング</p><p>※通常の清掃や退去時の清掃を怠った場合のみ</p></td><td><p>部位ごと、又は住戸全体</p></td><td><p>経過年数は考慮しない。借主負担となるのは、通常の清掃を実施していない場合で、部位又は住戸全体の清掃費用相当分を借主負担とする。</p></td></tr></table><p>設備等の経過年数と借主負担割合（耐用年数６年及び８年、定額法の場合）</p>< </tr><tr><td rowspan=\"4\"><p>設備・その他</p></td><td><p>共通</p></td><td></td><td></td><td></td></tr><tr><td><p>玄関・廊下</p></td><td></td><td></td><td></td></tr><tr><td><p>台所・キッチン</p></td><td></td><td></td><td></td></tr><tr><td><p>浴室・洗面所・トイレ</p></td><td></td><td></td><td></td></tr><tr><td colspan=\"2\"><p>その他</p></td><td></td><td></td><td></td></tr></table><p>※この単価は、あくまでも目安であり、入居時における借主・貸主双方で負担の概算額を認識するためのものです。</p><p>※従って、退去時においては、資材の価格や在庫状況の変動、毀損の程度や原状回復施工方法等を考慮して、借主・貸主双方で協議した施工単価で原状回復工事を実施することとなります。</p><p>Ⅱ　例外としての特約</p><p>原状回復に関する費用の一般原則は上記のとおりですが、借主は、例外として、下記の費用については、借主の負担とすることに合意します（ただし、民法第90条並びに消費者契約法第８条、第８条の２、第９条及び第10条に反しない内容に限ります）。</p>{{TOKUYAKU5}}<p class=\"small\">（括弧内は、本来は貸主が負担すべきものである費用を、特別に借主が負担することとする理由。）</p></div>", "sign_intro": "下記貸主（甲）と借主（乙）は、本物件について上記のとおり賃貸借契約を締結し、また甲と連帯保証人（丙）は、上記のとおり乙の債務について保証契約を締結したことを証するため、本契約書３通を作成し、甲乙丙記名押印の上、各自その1通を保有する。"}, "futsu_gyosha": {"title": "賃貸住宅標準契約書", "type": "普通借家", "guarantee": "家賃債務保証業者", "word": "https://www.mlit.go.jp/common/001479790.docx", "pdf": "https://www.mlit.go.jp/common/001479824.pdf", "page": "https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000023.html", "articles": [{"kind": "head", "text": "（契約の締結）"}, {"kind": "p", "text": "第１条　貸主（以下「甲」という。）及び借主（以下「乙」という。）は、頭書（１）に記載する賃貸借の目的物（以下「本物件」という。）について、以下の条項により賃貸借契約（以下「本契約」という。）を締結した。"}, {"kind": "head", "text": "（契約期間及び更新）"}, {"kind": "p", "text": "第２条　契約期間は、頭書（２）に記載するとおりとする。"}, {"kind": "p", "text": "２　甲及び乙は、協議の上、本契約を更新することができる。"}, {"kind": "head", "text": "（使用目的）"}, {"kind": "p", "text": "第３条　乙は、居住のみを目的として本物件を使用しなければならない。"}, {"kind": "head", "text": "（賃料）"}, {"kind": "p", "text": "第４条　乙は、頭書（３）の記載に従い、賃料を甲に支払わなければならない。"}, {"kind": "p", "text": "２　１か月に満たない期間の賃料は、１か月を30日として日割計算した額とする。"}, {"kind": "p", "text": "３　甲及び乙は、次の各号の一に該当する場合には、協議の上、賃料を改定することができる。"}, {"kind": "p", "text": "一　土地又は建物に対する租税その他の負担の増減により賃料が不相当となった場合"}, {"kind": "p", "text": "二　土地又は建物の価格の上昇又は低下その他の経済事情の変動により賃料が不相当となった場合"}, {"kind": "p", "text": "三　近傍同種の建物の賃料に比較して賃料が不相当となった場合"}, {"kind": "head", "text": "（共益費）"}, {"kind": "p", "text": "第５条　乙は、階段、廊下等の共用部分の維持管理に必要な光熱費、上下水道使用料、清掃費等（以下この条において「維持管理費」という。）に充てるため、共益費を甲に支払うものとする。"}, {"kind": "p", "text": "２　前項の共益費は、頭書（３）の記載に従い、支払わなければならない。"}, {"kind": "p", "text": "３　１か月に満たない期間の共益費は、１か月を30日として日割計算した額とする。"}, {"kind": "p", "text": "４　甲及び乙は、維持管理費の増減により共益費が不相当となったときは、協議の上、共益費を改定することができる。"}, {"kind": "head", "text": "（敷金）"}, {"kind": "p", "text": "第６条　乙は、本契約から生じる債務の担保として、頭書（３）に記載する敷金を甲に交付するものとする。"}, {"kind": "p", "text": "２　甲は、乙が本契約から生じる債務を履行しないときは、敷金をその債務の弁済に充てることができる。この場合において、乙は、本物件を明け渡すまでの間、敷金をもって当該債務の弁済に充てることを請求することができない。"}, {"kind": "p", "text": "３　甲は、本物件の明渡しがあったときは、遅滞なく、敷金の全額を乙に返還しなければならない。ただし、本物件の明渡し時に、賃料の滞納、第15条に規定する原状回復に要する費用の未払いその他の本契約から生じる乙の債務の不履行が存在する場合には、甲は、当該債務の額を敷金から差し引いた額を返還するものとする。"}, {"kind": "p", "text": "４　前項ただし書の場合には、甲は、敷金から差し引く債務の額の内訳を乙に明示しなければならない。"}, {"kind": "head", "text": "（反社会的勢力の排除）"}, {"kind": "p", "text": "第７条　甲及び乙は、それぞれ相手方に対し、次の各号の事項を確約する。"}, {"kind": "p", "text": "一　自らが、暴力団、暴力団関係企業、総会屋若しくはこれらに準ずる者又はその構成員（以下総称して「反社会的勢力」という。）ではないこと。"}, {"kind": "p", "text": "二　自らの役員（業務を執行する社員、取締役、執行役又はこれらに準ずる者をいう。）が反社会的勢力ではないこと。"}, {"kind": "p", "text": "三　反社会的勢力に自己の名義を利用させ、この契約を締結するものでないこと。"}, {"kind": "p", "text": "四　自ら又は第三者を利用して、次の行為をしないこと。"}, {"kind": "p", "text": "ア　相手方に対する脅迫的な言動又は暴力を用いる行為"}, {"kind": "p", "text": "イ　偽計又は威力を用いて相手方の業務を妨害し、又は信用を毀損する行為"}, {"kind": "p", "text": "２　乙は、甲の承諾の有無にかかわらず、本物件の全部又は一部につき、反社会的勢力に賃借権を譲渡し、又は転貸してはならない。"}, {"kind": "head", "text": "（禁止又は制限される行為）"}, {"kind": "p", "text": "第８条　乙は、甲の書面による承諾を得ることなく、本物件の全部又は一部につき、賃借権を譲渡し、又は転貸してはならない。"}, {"kind": "p", "text": "２　乙は、甲の書面による承諾を得ることなく、本物件の増築、改築、移転、改造若しくは模様替又は本物件の敷地内における工作物の設置を行ってはならない。"}, {"kind": "p", "text": "３　乙は、本物件の使用に当たり、別表第１に掲げる行為を行ってはならない。"}, {"kind": "p", "text": "４　乙は、本物件の使用に当たり、甲の書面による承諾を得ることなく、別表第２に掲げる行為を行ってはならない。"}, {"kind": "p", "text": "５　乙は、本物件の使用に当たり、別表第３に掲げる行為を行う場合には、甲に通知しなければならない。"}, {"kind": "head", "text": "（契約期間中の修繕）"}, {"kind": "p", "text": "第９条　甲は、乙が本物件を使用するために必要な修繕を行わなければならない。この場合の修繕に要する費用については、乙の責めに帰すべき事由により必要となったものは乙が負担し、その他のものは甲が負担するものとする。"}, {"kind": "p", "text": "２　前項の規定に基づき甲が修繕を行う場合は、甲は、あらかじめ、その旨を乙に通知しなければならない。この場合において、乙は、正当な理由がある場合を除き、当該修繕の実施を拒否することができない。"}, {"kind": "p", "text": "３　乙は、本物件内に修繕を要する箇所を発見したときは、甲にその旨を通知し修繕の必要について協議するものとする。"}, {"kind": "p", "text": "４　前項の規定による通知が行われた場合において、修繕の必要が認められるにもかかわらず、甲が正当な理由なく修繕を実施しないときは、乙は自ら修繕を行うことができる。この場合の修繕に要する費用については、第１項に準ずるものとする。"}, {"kind": "p", "text": "５　乙は、別表第４に掲げる修繕について、第１項に基づき甲に修繕を請求するほか、自ら行うことができる。乙が自ら修繕を行う場合においては、修繕に要する費用は乙が負担するものとし、甲への通知及び甲の承諾を要しない。"}, {"kind": "head", "text": "（契約の解除）"}, {"kind": "p", "text": "第10条　甲は、乙が次に掲げる義務に違反した場合において、甲が相当の期間を定めて当該義務の履行を催告したにもかかわらず、その期間内に当該義務が履行されないときは、本契約を解除することができる。"}, {"kind": "p", "text": "一　第４条第１項に規定する賃料支払義務"}, {"kind": "p", "text": "二　第５条第２項に規定する共益費支払義務"}, {"kind": "p", "text": "三　前条第１項後段に規定する乙の費用負担義務"}, {"kind": "p", "text": "２　甲は、乙が次に掲げる義務に違反した場合において、甲が相当の期間を定めて当該義務の履行を催告したにもかかわらず、その期間内に当該義務が履行されずに当該義務違反により本契約を継続することが困難であると認められるに至ったときは、本契約を解除することができる。"}, {"kind": "p", "text": "一　第３条に規定する本物件の使用目的遵守義務"}, {"kind": "p", "text": "二　第８条各項に規定する義務（同条第３項に規定する義務のうち、別表第１第六号から第八号に掲げる行為に係るものを除く。）"}, {"kind": "p", "text": "三　その他本契約書に規定する乙の義務"}, {"kind": "p", "text": "３　甲又は乙の一方について、次のいずれかに該当した場合には、その相手方は、何らの催告も要せずして、本契約を解除することができる。"}, {"kind": "p", "text": "一　第７条第１項各号の確約に反する事実が判明した場合"}, {"kind": "p", "text": "二　契約締結後に自ら又は役員が反社会的勢力に該当した場合"}, {"kind": "p", "text": "４　甲は、乙が第７条第２項に規定する義務に違反した場合又は別表第１第六号から第八号に掲げる行為を行った場合には、何らの催告も要せずして、本契約を解除することができる。"}, {"kind": "head", "text": "（乙からの解約）"}, {"kind": "p", "text": "第11条　乙は、甲に対して少なくとも30日前に解約の申入れを行うことにより、本契約を解約することができる。"}, {"kind": "p", "text": "２　前項の規定にかかわらず、乙は、解約申入れの日から30日分の賃料（本契約の解約後の賃料相当額を含む。）を甲に支払うことにより、解約申入れの日から起算して30日を経過する日までの間、随時に本契約を解約することができる。"}, {"kind": "head", "text": "（一部滅失等による賃料の減額等）"}, {"kind": "p", "text": "第12条　本物件の一部が滅失その他の事由により使用できなくなった場合において、それが乙の責めに帰することができない事由によるものであるときは、賃料は、その使用できなくなった部分の割合に応じて、減額されるものとする。この場合において、甲及び乙は、減額の程度、期間その他必要な事項について協議するものとする。"}, {"kind": "p", "text": "２　本物件の一部が滅失その他の事由により使用できなくなった場合において、残存する部分のみでは乙が賃借をした目的を達することができないときは、乙は、本契約を解除することができる。"}, {"kind": "head", "text": "（契約の終了）"}, {"kind": "p", "text": "第13条　本契約は、本物件の全部が滅失その他の事由により使用できなくなった場合には、これによって終了する。"}, {"kind": "head", "text": "（明渡し）"}, {"kind": "p", "text": "第14条　乙は、本契約が終了する日までに（第10条の規定に基づき本契約が解除された場合にあっては、直ちに）、本物件を明け渡さなければならない。"}, {"kind": "p", "text": "２　乙は、前項の明渡しをするときには、明渡し日を事前に甲に通知しなければならない。"}, {"kind": "head", "text": "（明渡し時の原状回復）"}, {"kind": "p", "text": "第15条　乙は、通常の使用に伴い生じた本物件の損耗及び本物件の経年変化を除き、本物件を原状回復しなければならない。ただし、乙の責めに帰することができない事由により生じたものについては、原状回復を要しない。"}, {"kind": "p", "text": "２　甲及び乙は、本物件の明渡し時において、契約時に特約を定めた場合は当該特約を含め、別表第５の規定に基づき乙が行う原状回復の内容及び方法について協議するものとする。"}, {"kind": "head", "text": "（立入り）"}, {"kind": "p", "text": "第16条　甲は、本物件の防火、本物件の構造の保全その他の本物件の管理上特に必要があるときは、あらかじめ乙の承諾を得て、本物件内に立ち入ることができる。"}, {"kind": "p", "text": "２　乙は、正当な理由がある場合を除き、前項の規定に基づく甲の立入りを拒否することはできない。"}, {"kind": "p", "text": "３　本契約終了後において本物件を賃借しようとする者又は本物件を譲り受けようとする者が下見をするときは、甲及び下見をする者は、あらかじめ乙の承諾を得て、本物件内に立ち入ることができる。"}, {"kind": "p", "text": "４　甲は、火災による延焼を防止する必要がある場合その他の緊急の必要がある場合においては、あらかじめ乙の承諾を得ることなく、本物件内に立ち入ることができる。この場合において、甲は、乙の不在時に立ち入ったときは、立入り後その旨を乙に通知しなければならない。"}, {"kind": "head", "text": "（家賃債務保証業者の提供する保証）"}, {"kind": "p", "text": "第17条　頭書（６）に記載する家賃債務保証業者の提供する保証を利用する場合には、家賃債務保証業者が提供する保証の内容については別に定めるところによるものとし、甲及び乙は、本契約と同時に当該保証を利用するために必要な手続を取らなければならない。"}, {"kind": "head", "text": "（協議）"}, {"kind": "p", "text": "第18条　甲及び乙は、本契約書に定めがない事項及び本契約書の条項の解釈について疑義が生じた場合は、民法その他の法令及び慣行に従い、誠意をもって協議し、解決するものとする。"}, {"kind": "head", "text": "（特約条項）"}, {"kind": "p", "text": "第19条　第18条までの規定以外に、本契約の特約については、下記のとおりとする。"}], "beppyo": [{"title": "別表第１（第８条第３項関係）", "lines": ["一　銃砲、刀剣類又は爆発性、発火性を有する危険な物品等を製造又は保管すること。", "二　大型の金庫その他の重量の大きな物品等を搬入し、又は備え付けること。", "三　排水管を腐食させるおそれのある液体を流すこと。", "四　大音量でテレビ、ステレオ等の操作、ピアノ等の演奏を行うこと。", "五　猛獣、毒蛇等の明らかに近隣に迷惑をかける動物を飼育すること。", "六　本物件を、反社会的勢力の事務所その他の活動の拠点に供すること。", "七　本物件又は本物件の周辺において、著しく粗野若しくは乱暴な言動を行い、又は威勢を示すことにより、付近の住民又は通行人に不安を覚えさせること。", "八　本物件に反社会的勢力を居住させ、又は反復継続して反社会的勢力を出入りさせること。"]}, {"title": "別表第２（第８条第４項関係）", "lines": ["一　階段、廊下等の共用部分に物品を置くこと。", "二　階段、廊下等の共用部分に看板、ポスター等の広告物を掲示すること。", "三　観賞用の小鳥、魚等であって明らかに近隣に迷惑をかけるおそれのない動物以外の犬、猫等の動物（別表第１第五号に掲げる動物を除く。）を飼育すること。"]}, {"title": "別表第３（第８条第５項関係）", "lines": ["一　頭書（５）に記載する同居人に新たな同居人を追加（出生を除く。）すること。", "二　１か月以上継続して本物件を留守にすること。"]}, {"title": "別表第４（第９条第５項関係）", "lines": ["ヒューズの取替え", "蛇口のパッキン、コマの取替え", "風呂場等のゴム栓、鎖の取替え", "電球、蛍光灯の取替え", "その他費用が軽微な修繕"]}], "beppyo5": "<div class=\"kb\"><p>【原状回復の条件について】</p><p>本物件の原状回復条件は、下記Ⅱの「例外としての特約」による以外は、賃貸住宅の原状回復に関する費用負担の一般原則の考え方によります。すなわち、</p><p>・　借主の故意・過失、善管注意義務違反、その他通常の使用方法を超えるような使用による損耗等については、借主が負担すべき費用となる。なお、震災等の不可抗力による損耗、上階の居住者など借主と無関係な第三者がもたらした損耗等については、借主が負担すべきものではない。</p><p>・　建物・設備等の自然的な劣化・損耗等（経年変化）及び借主の通常の使用により生ずる損耗等（通常損耗）については、貸主が負担すべき費用となる</p><p>ものとします。</p><p>その具体的内容は、国土交通省の「原状回復をめぐるトラブルとガイドライン（再改訂版）」において定められた別表１及び別表２のとおりですが、その概要は、下記Ⅰのとおりです。</p><p>Ⅰ　本物件の原状回復条件</p><p>（ただし、民法第90条並びに消費者契約法第８条、第８条の２、第９条及び第10条に反しない内容に関して、下記Ⅱの「例外としての特約」の合意がある場合は、その内容によります。）</p><p>　１　貸主・借主の修繕分担表</p><table class=\"kt\"><tr><td><p>貸主の負担となるもの</p></td><td><p>借主の負担となるもの</p></td></tr><tr><td colspan=\"2\"><p>【床（畳・フローリング・カーペットなど）】</p></td></tr><tr><td><p>１．畳の裏返し、表替え（特に破損してないが、次の入居者確保のために行うもの）</p><p>２．フローリングのワックスがけ</p><p>３．家具の設置による床、カーペットのへこみ、設置跡</p><p>４．畳の変色、フローリングの色落ち（日照、建物構造欠陥による雨漏りなどで発生したもの）</p></td><td><p>１．カーペットに飲み物等をこぼしたことによるシミ、カビ（こぼした後の手入れ不足等の場合）</p><p>２．冷蔵庫下のサビ跡（サビを放置し、床に汚損等の損害を与えた場合）</p><p>３．引越作業等で生じた引っかきキズ</p><p>４．フローリングの色落ち（借主の不注意で雨が吹き込んだことなどによるもの）</p></td></tr><tr><td colspan=\"2\"><p>【壁、天井（クロスなど）】</p></td></tr><tr><td><p>１．テレビ、冷蔵庫等の後部壁面の黒ずみ（いわゆる電気ヤケ）</p><p>２．壁に貼ったポスターや絵画の跡</p><p>３．壁等の画鋲、ピン等の穴（下地ボードの張替えは不要な程度のもの）</p><p>４．エアコン（借主所有）設置による壁のビス穴、跡</p><p>５．クロスの変色（日照などの自然現象によるもの）</p></td><td><p>１．借主が日常の清掃を怠ったための台所の油汚れ（使用後の手入れが悪く、ススや油が付着している場合）</p><p>２．借主が結露を放置したことで拡大したカビ、シミ（貸主に通知もせず、かつ、拭き取るなどの手入れを怠り、壁等を腐食させた場合）</p><p>３．クーラーから水漏れし、借主が放置したため壁が腐食</p><p>４．タバコ等のヤニ、臭い（喫煙等によりクロス等が変色したり、臭いが付着している場合）</p><p>５．壁等のくぎ穴、ネジ穴（重量物をかけるためにあけたもので、下地ボードの張替えが必要な程度のもの）</p><p>６．借主が天井に直接つけた照明器具の跡</p><p>７．落書き等の故意による毀損</p></td></tr><tr><td colspan=\"2\"><p>【建具等、襖、柱等】</p></td></tr><tr><td><p>１．網戸の張替え（特に破損はしてないが、次の入居者確保のために行うもの）</p><p>２．地震で破損したガラス</p><p>３．網入りガラスの亀裂（構造により自然に発生したもの）</p></td><td><p>１．飼育ペットによる柱等のキズ、臭い（ペットによる柱、クロス等にキズが付いたり、臭いが付着している場合）</p><p>２．落書き等の故意による毀損</p></td></tr><tr><td colspan=\"2\"><p>【設備、その他】</p></td></tr><tr><td><p>１．専門業者による全体のハウスクリーニング（借主が通常の清掃を実施している場合）</p><p>２．エアコンの内部洗浄（喫煙等の臭いなどが付着していない場合）</p><p>３．消毒（台所・トイレ）</p><p>４．浴槽、風呂釜等の取替え（破損等はしていないが、次の入居者確保のために行うもの）</p><p>５．鍵の取替え（破損、鍵紛失のない場合）</p><p>６．設備機器の故障、使用不能（機器の寿命によるもの）</p></td><td><p>１．ガスコンロ置き場、換気扇等の油汚れ、すす（借主が清掃・手入れを怠った結果汚損が生じた場合）</p><p>２．風呂、トイレ、洗面台の水垢、カビ等（借主が清掃・手入れを怠った結果汚損が生じた場合）</p><p>３．日常の不適切な手入れ又は用法違反による設備の毀損</p><p>４．鍵の紛失又は破損による取替え</p><p>５．戸建賃貸住宅の庭に生い茂った雑草</p></td></tr></table></div><div class=\"kb\"><p>　２　借主の負担単位</p><table class=\"kt\"><tr><td colspan=\"2\"><p>負担</p><p>内容</p></td><td colspan=\"2\"><p>借主の負担単位</p></td><td><p>経過年数等の考慮</p></td></tr><tr><td rowspan=\"3\"><p>床</p></td><td rowspan=\"3\"><p>毀損部分の補修</p></td><td><p>畳</p></td><td><p>原則一枚単位</p><p>毀損部分が複数枚の場合はその枚数分（裏返しか表替えかは、毀損の程度による）</p></td><td><p>（畳表）</p><p>経過年数は考慮しない。</p></td></tr><tr><td><p>カーペット</p><p>クッションフロア</p></td><td><p>毀損等が複数箇所の場合は、居室全体</p></td><td><p>（畳床・カーペット・クッションフロア）</p><p>６年で残存価値１円となるような負担割合を算定する。</p></td></tr><tr><td><p>フローリング</p></td><td><p>原則㎡単位</p><p>毀損等が複数箇所の場合は、居室全体</p></td><td><p>（フローリング）</p><p>補修は経過年数を考慮しない。</p><p>（フローリング全体にわたる毀損等があり、張り替える場合は、当該建物の耐用年数で残存価値１円となるような負担割合を算定する。）</p></td></tr><tr><td rowspan=\"2\"><p>壁・天井(クロス)</p></td><td rowspan=\"2\"><p>毀損部分の補修</p></td><td><p>壁（クロス）</p></td><td><p>㎡単位が望ましいが、借主が毀損した箇所を含む一面分までは張替え費用を借主負担としてもやむをえないとする。</p></td><td rowspan=\"2\"><p>（壁〔クロス〕）</p><p>６年で残存価値１円となるような負担割合を算定する。</p></td></tr><tr><td><p>タバコ等の</p><p>ヤニ、臭い</p></td><td><p>喫煙等により当該居室全体においてクロス等がヤニで変色したり臭いが付着した場合のみ、居室全体のクリーニング又は張替え費用を借主負担とすることが妥当と考えられる。</p></td></tr><tr><td rowspan=\"2\"><p>建具・柱</p></td><td rowspan=\"2\"><p>毀損部分</p><p>の補修</p></td><td><p>襖</p></td><td><p>１枚単位</p></td><td><p>（襖紙、障子紙）</p><p>経過年数は考慮しない。</p></td></tr><tr><td><p>柱</p></td><td><p>１本単位</p></td><td><p>（襖、障子等の建具部分、柱）</p><p>経過年数は考慮しない。</p></td></tr><tr><td rowspan=\"3\"><p>設備・その他</p></td><td><p>設備の</p><p>補修</p></td><td><p>設備機器</p></td><td><p>補修部分、交換相当費用</p></td><td><p>（設備機器）</p><p>耐用年数経過時点で残存価値１円となるような直線(又は曲線)を想定し、負担割合を算定する。</p></td></tr><tr><td><p>鍵の</p><p>返却</p></td><td><p>鍵</p></td><td><p>補修部分</p><p>紛失の場合は、シリンダーの交換も含む。</p></td><td><p>鍵の紛失の場合は、経過年数は考慮しない。交換費用相当分を借主負担とする。</p></td></tr><tr><td><p>通常の</p><p>清掃※</p></td><td><p>クリーニング</p><p>※通常の清掃や退去時の清掃を怠った場合のみ</p></td><td><p>部位ごと、又は住戸全体</p></td><td><p>経過年数は考慮しない。借主負担となるのは、通常の清掃を実施していない場合で、部位又は住戸全体の清掃費用相当分を借主負担とする。</p></td></tr></table><p>設備等の経過年数と借主負担割合（耐用年数６年及び８年、定額法の場合）</p><p>借主負担割合（原状回復義務がある場合）</p><p class=\"fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAJYCAIAAABzcgN0AAAACXBIWXMAACHVAAAh1QEEnLSdAADLRklEQVR4nOydeXwUVfb26aSzQCBhaZYEJiwJkGAgsi8CigFECSDIJqLGKIoIiIoLjKiDiggqCoqog2ZEkZ8aB0ZURBlEMQiKLALDYhAQg2wmwUQJSbreQy7U23b3vekk3alT3c/3Dz7h9u1bp6vrqT5P1a1za2gAmIonnniicePGTo0333xz9+7dZW+JiIh4+umnq7LR1atX16hR49dff63KIMSLL74YHBzsSc/rrrvuqquuUnQ4depUfHx8aWkp/b1y5UoKj1qc+tCOGjBgwDMuDBs2LCwsrNwYDh8+fOzYMbcvfffdd4cOHXJseeyxxxy/F/qYS5YsKXcTd999d6tWrQ4p+cc//hEUFPTyyy+XO1rloF3Up08fT3r+9ttvtJ9XrVqlt1x77bVZWVmOfW644YbLL79c/29RUdH1119/4sSJcgenr3L58uV0GNO343qQbNu2jTZNu53+3rt37zXXXONJwMTgwYNpQP2/tD9pnJkzZ65w4bLLLnOMXFMerm+++ab+d9u2be+77z7HV+12e0FBAammVq1ae/bscXypuLjYaY85ce7cOacDYOfOnRTzokWLnNrj4uJuvfVWp8avv/66YcOGJHn6RLJNkLImTpz4+eef07D6YUxb2ejAvffea7Va169f79h45ZVXUvuff/6piJ/46KOPYmNjS0pKnNrT09PpgNH/SwJ58MEH//73v8+dO5d2PgUzcuRI9cg33njj2LFj9f+mpKQ89dRT9EdOTk69evXoI7h9l/jSMzIyFCPv2LEjJCSkf//+9AWpY9Bp3779oEGDyu22ffv2KVOmUABNmzZ99tlnz5w5IwKm0wV9HPqaSDK0q1977TX6m3YI9ZwzZw79TZ+UTlP0lnI34bvTyOuvv07xyE6DAJiaGkYHAEDFqJwBeP7556uyUYYGgBA/pZrSAEyYMOE7F6ZPn+6JAaBhQ0NDKSm5wQX6LY+MjKQUSu9caQNA6aO6D+00T6KtNE8++WTNmjUp7yy3J+062s8//fSTY+M333zj+F9HA/D7779TKlzusNTnvffea9euXceOHQ8ePOj2IJk2bRrlu/p/hw4d+p///KfckTWJAXD84nRuueUWSr8cWzw8XF0NAPHjjz9SSkoe1enI6dGjBwVAabRstOPHj//9r9Dg9BZKnZ3au3XrVr9+ff2/5Gpuu+02 iAAAAIAQAQAAACECAAAAQgQAAACECAAAAAiZAwAAMgYAAAhZAAAgwwMAAAAhAgAAAEIEAAAAhAgAAAAIEQAAABAiAAAAIEQAAABAiAAAAIAQAQAAACECAAAAQgQAAACECAAAAAgRAAAAECIAAAAgRAAAAECIAAAAgBABAAAAIQIAAABCBAAAAIQIAAAACBEAAAAQ8gepOi8YJ9fBAAAAAElFTkSuQmCC\" alt=\"設備等の経過年数と借主負担割合のグラフ\"></p></div><div class=\"kb\"><p>　３　原状回復工事施工目安単価</p><p>（物件に応じて、空欄に「対象箇所」、「単位」、「単価（円）」を記入して使用してください。）</p><table class=\"kt\"><tr><td colspan=\"3\"><p>対象箇所</p></td><td><p>単位</p></td><td><p>単価（円）</p></td></tr><tr><td colspan=\"2\"><p>床</p></td><td></td><td></td><td></td></tr><tr><td colspan=\"2\"><p>天井・壁</p></td><td></td><td></td><td></td></tr><tr><td colspan=\"2\"><p>建具・柱</p></td><td></td><td></td><td></td></tr><tr><td rowspan=\"4\"><p>設備・その他</p></td><td><p>共通</p></td><td></td><td></td><td></td></tr><tr><td><p>玄関・廊下</p></td><td></td><td></td><td></td></tr><tr><td><p>台所・キッチン</p></td><td></td><td></td><td></td></tr><tr><td><p>浴室・洗面所・トイレ</p></td><td></td><td></td><td></td></tr><tr><td colspan=\"2\"><p>その他</p></td><td></td><td></td><td></td></tr></table><p>※この単価は、あくまでも目安であり、入居時における借主・貸主双方で負担の概算額を認識するためのものです。</p><p>※従って、退去時においては、資材の価格や在庫状況の変動、毀損の程度や原状回復施工方法等を考慮して、借主・貸主双方で協議した施工単価で原状回復工事を実施することとなります。</p><p>Ⅱ　例外としての特約</p><p>原状回復に関する費用の一般原則は上記のとおりですが、借主は、例外として、下記の費用については、借主の負担とすることに合意します（ただし、民法第90条並びに消費者契約法第８条、第８条の２、第９条及び第10条に反しない内容に限ります）。</p>{{TOKUYAKU5}}<p class=\"small\">（括弧内は、本来は貸主が負担すべきものである費用を、特別に借主が負担することとする理由。）</p></div>", "sign_intro": "下記貸主（甲）と借主（乙）は、本物件について上記のとおり賃貸借契約を締結したことを証するため、本契約書２通を作成し、甲乙記名押印の上、各自その１通を保有する。"}, "teiki_gyosha": {"title": "定期賃貸住宅標準契約書", "type": "定期借家", "guarantee": "家賃債務保証業者", "word": "https://www.mlit.go.jp/common/001479797.docx", "pdf": "https://www.mlit.go.jp/common/001479829.pdf", "page": "https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000030.html", "articles": [{"kind": "head", "text": "（契約の締結）"}, {"kind": "p", "text": "第１条　貸主（以下「甲」という。）及び借主（以下「乙」という。）は、頭書（１）に記載する賃貸借の目的物（以下「本物件」という。）について、以下の条項により借地借家法（以下「法」という。）第38条に規定する定期建物賃貸借契約（以下「本契約」という。）を締結した。"}, {"kind": "head", "text": "（契約期間）"}, {"kind": "p", "text": "第２条　契約期間は、頭書（２）に記載するとおりとする。"}, {"kind": "p", "text": "２　本契約は、前項に規定する期間の満了により終了し、更新がない。ただし、甲及び乙は、協議の上、本契約の期間の満了の日の翌日を始期とする新たな賃貸借契約（以下「再契約」という。）をすることができる。"}, {"kind": "p", "text": "３　甲は、第１項に規定する期間の満了の１年前から６月前までの間（以下「通知期間」という。）に乙に対し、期間の満了により賃貸借が終了する旨を書面によって通知するものとする。"}, {"kind": "p", "text": "４　甲は、前項に規定する通知をしなければ、賃貸借の終了を乙に主張することができず、乙は、第１項に規定する期間の満了後においても、本物件を引き続き賃借することができる。ただし、甲が通知期間の経過後乙に対し期間の満了により賃貸借が終了する旨の通知をした場合においては、その通知の日から６月を経過した日に賃貸借は終了する。"}, {"kind": "head", "text": "（使用目的）"}, {"kind": "p", "text": "第３条　乙は、居住のみを目的として本物件を使用しなければならない。"}, {"kind": "head", "text": "（賃料）"}, {"kind": "p", "text": "第４条　乙は、頭書（３）の記載に従い、賃料を甲に支払わなければならない。"}, {"kind": "p", "text": "２　１か月に満たない期間の賃料は、１か月を30日として日割計算した額とする。"}, {"kind": "p", "text": "３　甲及び乙は、次の各号の一に該当する場合には、協議の上、賃料を改定することができる。"}, {"kind": "p", "text": "一　土地又は建物に対する租税その他の負担の増減により賃料が不相当となった場合"}, {"kind": "p", "text": "二　土地又は建物の価格の上昇又は低下その他の経済事情の変動により賃料が不相当となった場合"}, {"kind": "p", "text": "三　近傍同種の建物の賃料に比較して賃料が不相当となった場合"}, {"kind": "head", "text": "（共益費）"}, {"kind": "p", "text": "第５条　乙は、階段、廊下等の共用部分の維持管理に必要な光熱費、上下水道使用料、清掃費等（以下この条において「維持管理費」という。）に充てるため、共益費を甲に支払うものとする。"}, {"kind": "p", "text": "２　前項の共益費は、頭書（３）の記載に従い、支払わなければならない。"}, {"kind": "p", "text": "３　１か月に満たない期間の共益費は、１か月を30日として日割計算した額とする。"}, {"kind": "p", "text": "４　甲及び乙は、維持管理費の増減により共益費が不相当となったときは、協議の上、共益費を改定することができる。"}, {"kind": "head", "text": "（敷金）"}, {"kind": "p", "text": "第６条　乙は、本契約から生じる債務の担保として、頭書（３）に記載する敷金を甲に交付するものとする。"}, {"kind": "p", "text": "２　甲は、乙が本契約から生じる債務を履行しないときは、敷金をその債務の弁済に充てることができる。この場合において、乙は、本物件を明け渡すまでの間、敷金をもって当該債務の弁済に充てることを請求することができない。"}, {"kind": "p", "text": "３　甲は、本物件の明渡しがあったときは、遅滞なく、敷金の全額を乙に返還しなければならない。ただし、本物件の明渡し時に、賃料の滞納、第15条に規定する原状回復に要する費用の未払いその他の本契約から生じる乙の債務の不履行が存在する場合には、甲は、当該債務の額を敷金から差し引いた額を返還するものとする。"}, {"kind": "p", "text": "４　前項ただし書の場合には、甲は、敷金から差し引く債務の額の内訳を乙に明示しなければならない。"}, {"kind": "head", "text": "（反社会的勢力の排除）"}, {"kind": "p", "text": "第７条　甲及び乙は、それぞれ相手方に対し、次の各号の事項を確約する。"}, {"kind": "p", "text": "一　自らが、暴力団、暴力団関係企業、総会屋若しくはこれらに準ずる者又はその構成員（以下総称して「反社会的勢力」という。）ではないこと。"}, {"kind": "p", "text": "二　自らの役員（業務を執行する社員、取締役、執行役又はこれらに準ずる者をいう。）が反社会的勢力ではないこと。"}, {"kind": "p", "text": "三　反社会的勢力に自己の名義を利用させ、この契約を締結するものでないこと。"}, {"kind": "p", "text": "四　自ら又は第三者を利用して、次の行為をしないこと。"}, {"kind": "p", "text": "ア　相手方に対する脅迫的な言動又は暴力を用いる行為"}, {"kind": "p", "text": "イ　偽計又は威力を用いて相手方の業務を妨害し、又は信用を毀損する行為"}, {"kind": "p", "text": "２　乙は、甲の承諾の有無にかかわらず、本物件の全部又は一部につき、反社会的勢力に賃借権を譲渡し、又は転貸してはならない。"}, {"kind": "head", "text": "（禁止又は制限される行為）"}, {"kind": "p", "text": "第８条　乙は、甲の書面による承諾を得ることなく、本物件の全部又は一部につき、賃借権を譲渡し、又は転貸してはならない。"}, {"kind": "p", "text": "２　乙は、甲の書面による承諾を得ることなく、本物件の増築、改築、移転、改造若しくは模様替又は本物件の敷地内における工作物の設置を行ってはならない。"}, {"kind": "p", "text": "３　乙は、本物件の使用に当たり、別表第１に掲げる行為を行ってはならない。"}, {"kind": "p", "text": "４　乙は、本物件の使用に当たり、甲の書面による承諾を得ることなく、別表第２に掲げる行為を行ってはならない。"}, {"kind": "p", "text": "５　乙は、本物件の使用に当たり、別表第３に掲げる行為を行う場合には、甲に通知しなければならない。"}, {"kind": "head", "text": "（契約期間中の修繕）"}, {"kind": "p", "text": "第９条　甲は、乙が本物件を使用するために必要な修繕を行わなければならない。この場合の修繕に要する費用については、乙の責めに帰すべき事由により必要となったものは乙が負担し、その他のものは甲が負担するものとする。"}, {"kind": "p", "text": "２　前項の規定に基づき甲が修繕を行う場合は、甲は、あらかじめ、その旨を乙に通知しなければならない。この場合において、乙は、正当な理由がある場合を除き、当該修繕の実施を拒否することができない。"}, {"kind": "p", "text": "３　乙は、本物件内に修繕を要する箇所を発見したときは、甲にその旨を通知し修繕の必要について協議するものとする。"}, {"kind": "p", "text": "４　前項の規定による通知が行われた場合において、修繕の必要が認められるにもかかわらず、甲が正当な理由なく修繕を実施しないときは、乙は自ら修繕を行うことができる。この場合の修繕に要する費用については、第１項に準ずるものとする。"}, {"kind": "p", "text": "５　乙は、別表第４に掲げる修繕について、第１項に基づき甲に修繕を請求するほか、自ら行うことができる。乙が自ら修繕を行う場合においては、修繕に要する費用は乙が負担するものとし、甲への通知及び甲の承諾を要しない。"}, {"kind": "head", "text": "（契約の解除）"}, {"kind": "p", "text": "第10条　甲は、乙が次に掲げる義務に違反した場合において、甲が相当の期間を定めて当該義務の履行を催告したにもかかわらず、その期間内に当該義務が履行されないときは、本契約を解除することができる。"}, {"kind": "p", "text": "一　第４条第１項に規定する賃料支払義務"}, {"kind": "p", "text": "二　第５条第２項に規定する共益費支払義務"}, {"kind": "p", "text": "三　前条第１項後段に規定する乙の費用負担義務"}, {"kind": "p", "text": "２　甲は、乙が次に掲げる義務に違反した場合において、甲が相当の期間を定めて当該義務の履行を催告したにもかかわらず、その期間内に当該義務が履行されずに当該義務違反により本契約を継続することが困難であると認められるに至ったときは、本契約を解除することができる。"}, {"kind": "p", "text": "一　第３条に規定する本物件の使用目的遵守義務"}, {"kind": "p", "text": "二　第８条各項に規定する義務（同条第３項に規定する義務のうち、別表第１第六号から第八号に掲げる行為に係るものを除く。）"}, {"kind": "p", "text": "三　その他本契約書に規定する乙の義務"}, {"kind": "p", "text": "３　甲又は乙の一方について、次のいずれかに該当した場合には、その相手方は、何らの催告も要せずして、本契約を解除することができる。"}, {"kind": "p", "text": "一　第７条第１項各号の確約に反する事実が判明した場合"}, {"kind": "p", "text": "二　契約締結後に自ら又は役員が反社会的勢力に該当した場合"}, {"kind": "p", "text": "４　甲は、乙が第７条第２項に規定する義務に違反した場合又は別表第１第六号から第八号に掲げる行為を行った場合には、何らの催告も要せずして、本契約を解除することができる。"}, {"kind": "head", "text": "（乙からの解約）"}, {"kind": "p", "text": "第11条　乙は、甲に対して少なくとも１月前に解約の申入れを行うことにより、本契約を解約することができる。"}, {"kind": "p", "text": "２　前項の規定にかかわらず、乙は、解約申入れの日から１月分の賃料（本契約の解約後の賃料相当額を含む。）を甲に支払うことにより、解約申入れの日から起算して１月を経過する日までの間、随時に本契約を解約することができる。"}, {"kind": "head", "text": "（一部滅失等による賃料の減額等）"}, {"kind": "p", "text": "第12条　本物件の一部が滅失その他の事由により使用できなくなった場合において、それが乙の責めに帰することができない事由によるものであるときは、賃料は、その使用できなくなった部分の割合に応じて、減額されるものとする。この場合において、甲及び乙は、減額の程度、期間その他必要な事項について協議するものとする。"}, {"kind": "p", "text": "２　本物件の一部が滅失その他の事由により使用できなくなった場合において、残存する部分のみでは乙が賃借をした目的を達することができないときは、乙は、本契約を解除することができる。"}, {"kind": "head", "text": "（契約の終了）"}, {"kind": "p", "text": "第13条　本契約は、本物件の全部が滅失その他の事由により使用できなくなった場合には、これによって終了する。"}, {"kind": "head", "text": "（明渡し）"}, {"kind": "p", "text": "第14条　乙は、本契約が終了する日（甲が第２条第３項に規定する通知をしなかった場合においては、同条第４項ただし書に規定する通知をした日から６月を経過した日）までに（第10条の規定に基づき本契約が解除された場合にあっては、直ちに）、本物件を明け渡さなければならない。"}, {"kind": "p", "text": "２　乙は、前項の明渡しをするときには、明渡し日を事前に甲に通知しなければならない。"}, {"kind": "head", "text": "（明渡し時の原状回復）"}, {"kind": "p", "text": "第15条　乙は、通常の使用に伴い生じた本物件の損耗及び本物件の経年変化を除き、本物件を原状回復しなければならない。ただし、乙の責めに帰することができない事由により生じたものについては、原状回復を要しない。"}, {"kind": "p", "text": "２　甲及び乙は、本物件の明渡し時において、契約時に特約を定めた場合は当該特約を含め、別表第５の規定に基づき乙が行う原状回復の内容及び方法について協議するものとする。"}, {"kind": "head", "text": "（立入り）"}, {"kind": "p", "text": "第16条　甲は、本物件の防火、本物件の構造の保全その他の本物件の管理上特に必要があるときは、あらかじめ乙の承諾を得て、本物件内に立ち入ることができる。"}, {"kind": "p", "text": "２　乙は、正当な理由がある場合を除き、前項の規定に基づく甲の立入りを拒否することはできない。"}, {"kind": "p", "text": "３　本契約終了後において本物件を賃借しようとする者又は本物件を譲り受けようとする者が下見をするときは、甲及び下見をする者は、あらかじめ乙の承諾を得て、本物件内に立ち入ることができる。"}, {"kind": "p", "text": "４　甲は、火災による延焼を防止する必要がある場合その他の緊急の必要がある場合においては、あらかじめ乙の承諾を得ることなく、本物件内に立ち入ることができる。この場合において、甲は、乙の不在時に立ち入ったときは、立入り後その旨を乙に通知しなければならない。"}, {"kind": "head", "text": "（家賃債務保証業者の提供する保証）"}, {"kind": "p", "text": "第17条　頭書（６）に記載する家賃債務保証業者の提供する保証を利用する場合には、家賃債務保証業者が提供する保証の内容については別に定めるところによるものとし、甲及び乙は、本契約と同時に当該保証を利用するために必要な手続を取らなければならない。"}, {"kind": "head", "text": "（再契約）"}, {"kind": "p", "text": "第18条　甲は、再契約の意向があるときは、第２条第３項に規定する通知の書面に、その旨を付記するものとする。"}, {"kind": "p", "text": "２　再契約をした場合は、第14条の規定は適用しない。この場合において、本契約における原状回復の債務の履行については、再契約に係る賃貸借が終了する日までに行うこととし、敷金の返還については、明渡しがあったものとして第６条第３項に規定するところによる。"}, {"kind": "head", "text": "（協議）"}, {"kind": "p", "text": "第19条　甲及び乙は、本契約書に定めがない事項及び本契約書の条項の解釈について疑義が生じた場合は、民法その他の法令及び慣行に従い、誠意をもって協議し、解決するものとする。"}, {"kind": "head", "text": "（特約条項）"}, {"kind": "p", "text": "第20条　第19条までの規定以外に、本契約の特約については、下記のとおりとする。"}], "beppyo": [{"title": "別表第１（第８条第３項関係）", "lines": ["一　銃砲、刀剣類又は爆発性、発火性を有する危険な物品等を製造又は保管すること。", "二　大型の金庫その他の重量の大きな物品等を搬入し、又は備え付けること。", "三　排水管を腐食させるおそれのある液体を流すこと。", "四　大音量でテレビ、ステレオ等の操作、ピアノ等の演奏を行うこと。", "五　猛獣、毒蛇等の明らかに近隣に迷惑をかける動物を飼育すること。", "六　本物件を、反社会的勢力の事務所その他の活動の拠点に供すること。", "七　本物件又は本物件の周辺において、著しく粗野若しくは乱暴な言動を行い、又は威勢を示すことにより、付近の住民又は通行人に不安を覚えさせること。", "八　本物件に反社会的勢力を居住させ、又は反復継続して反社会的勢力を出入りさせること。"]}, {"title": "別表第２（第８条第４項関係）", "lines": ["一　階段、廊下等の共用部分に物品を置くこと。", "二　階段、廊下等の共用部分に看板、ポスター等の広告物を掲示すること。", "三　観賞用の小鳥、魚等であって明らかに近隣に迷惑をかけるおそれのない動物以外の犬、猫等の動物（別表第１第五号に掲げる動物を除く。）を飼育すること。"]}, {"title": "別表第３（第８条第５項関係）", "lines": ["一　頭書（５）に記載する同居人に新たな同居人を追加（出生を除く。）すること。", "二　１か月以上継続して本物件を留守にすること。"]}, {"title": "別表第４（第９条第５項関係）", "lines": ["ヒューズの取替え", "蛇口のパッキン、コマの取替え", "風呂場等のゴム栓、鎖の取替え", "電球、蛍光灯の取替え", "その他費用が軽微な修繕"]}], "beppyo5": "<div class=\"kb\"><p>【原状回復の条件について】</p><p>本物件の原状回復条件は、下記Ⅱの「例外としての特約」による以外は、賃貸住宅の原状回復に関する費用負担の一般原則の考え方によります。すなわち、</p><p>・　借主の故意・過失、善管注意義務違反、その他通常の使用方法を超えるような使用による損耗等については、借主が負担すべき費用となる。なお、震災等の不可抗力による損耗、上階の居住者など借主と無関係な第三者がもたらした損耗等については、借主が負担すべきものではない。</p><p>・　建物・設備等の自然的な劣化・損耗等（経年変化）及び借主の通常の使用により生ずる損耗等（通常損耗）については、貸主が負担すべき費用となる</p><p>ものとします。</p><p>その具体的内容は、国土交通省の「原状回復をめぐるトラブルとガイドライン（再改訂版）」において定められた別表１及び別表２のとおりですが、その概要は、下記Ⅰのとおりです。</p><p>Ⅰ　本物件の原状回復条件</p><p>（ただし、民法第90条並びに消費者契約法第８条、第８条の２、第９条及び第10条に反しない内容に関して、下記Ⅱの「例外としての特約」の合意がある場合は、その内容によります。）</p><p>　１　貸主・借主の修繕分担表</p><table class=\"kt\"><tr><td><p>貸主の負担となるもの</p></td><td><p>借主の負担となるもの</p></td></tr><tr><td colspan=\"2\"><p>【床（畳・フローリング・カーペットなど）】</p></td></tr><tr><td><p>１．畳の裏返し、表替え（特に破損してないが、次の入居者確保のために行うもの）</p><p>２．フローリングのワックスがけ</p><p>３．家具の設置による床、カーペットのへこみ、設置跡</p><p>４．畳の変色、フローリングの色落ち（日照、建物構造欠陥による雨漏りなどで発生したもの）</p></td><td><p>１．カーペットに飲み物等をこぼしたことによるシミ、カビ（こぼした後の手入れ不足等の場合）</p><p>２．冷蔵庫下のサビ跡（サビを放置し、床に汚損等の損害を与えた場合）</p><p>３．引越作業等で生じた引っかきキズ</p><p>４．フローリングの色落ち（借主の不注意で雨が吹き込んだことなどによるもの）</p></td></tr><tr><td colspan=\"2\"><p>【壁、天井（クロスなど）】</p></td></tr><tr><td><p>１．テレビ、冷蔵庫等の後部壁面の黒ずみ（いわゆる電気ヤケ）</p><p>２．壁に貼ったポスターや絵画の跡</p><p>３．壁等の画鋲、ピン等の穴（下地ボードの張替えは不要な程度のもの）</p><p>４．エアコン（借主所有）設置による壁のビス穴、跡</p><p>５．クロスの変色（日照などの自然現象によるもの）</p></td><td><p>１．借主が日常の清掃を怠ったための台所の油汚れ（使用後の手入れが悪く、ススや油が付着している場合）</p><p>２．借主が結露を放置したことで拡大したカビ、シミ（貸主に通知もせず、かつ、拭き取るなどの手入れを怠り、壁等を腐食させた場合）</p><p>３．クーラーから水漏れし、借主が放置したため壁が腐食</p><p>４．タバコ等のヤニ、臭い（喫煙等によりクロス等が変色したり、臭いが付着している場合）</p><p>５．壁等のくぎ穴、ネジ穴（重量物をかけるためにあけたもので、下地ボードの張替えが必要な程度のもの）</p><p>６．借主が天井に直接つけた照明器具の跡</p><p>７．落書き等の故意による毀損</p></td></tr><tr><td colspan=\"2\"><p>【建具等、襖、柱等】</p></td></tr><tr><td><p>１．網戸の張替え（特に破損はしてないが、次の入居者確保のために行うもの）</p><p>２．地震で破損したガラス</p><p>３．網入りガラスの亀裂（構造により自然に発生したもの）</p></td><td><p>１．飼育ペットによる柱等のキズ、臭い（ペットによる柱、クロス等にキズが付いたり、臭いが付着している場合）</p><p>２．落書き等の故意による毀損</p></td></tr><tr><td colspan=\"2\"><p>【設備、その他】</p></td></tr><tr><td><p>１．専門業者による全体のハウスクリーニング（借主が通常の清掃を実施している場合）</p><p>２．エアコンの内部洗浄（喫煙等の臭いなどが付着していない場合）</p><p>３．消毒（台所・トイレ）</p><p>４．浴槽、風呂釜等の取替え（破損等はしていないが、次の入居者確保のために行うもの）</p><p>５．鍵の取替え（破損、鍵紛失のない場合）</p><p>６．設備機器の故障、使用不能（機器の寿命によるもの）</p></td><td><p>１．ガスコンロ置き場、換気扇等の油汚れ、すす（借主が清掃・手入れを怠った結果汚損が生じた場合）</p><p>２．風呂、トイレ、洗面台の水垢、カビ等（借主が清掃・手入れを怠った結果汚損が生じた場合）</p><p>３．日常の不適切な手入れ又は用法違反による設備の毀損</p><p>４．鍵の紛失又は破損による取替え</p><p>５．戸建賃貸住宅の庭に生い茂った雑草</p></td></tr></table></div><div class=\"kb\"><p>　２　借主の負担単位</p><table class=\"kt\"><tr><td colspan=\"2\"><p>負担</p><p>内容</p></td><td colspan=\"2\"><p>借主の負担単位</p></td><td><p>経過年数等の考慮</p></td></tr><tr><td rowspan=\"3\"><p>床</p></td><td rowspan=\"3\"><p>毀損部分の補修</p></td><td><p>畳</p></td><td><p>原則一枚単位</p><p>毀損部分が複数枚の場合はその枚数分（裏返しか表替えかは、毀損の程度による）</p></td><td><p>（畳表）</p><p>経過年数は考慮しない。</p></td></tr><tr><td><p>カーペット</p><p>クッション　フロア</p></td><td><p>毀損等が複数箇所の場合は、居室全体</p></td><td><p>（畳床・カーペット・クッションフロア）</p><p>６年で残存価値１円となるような負担割合を算定する。</p></td></tr><tr><td><p>フローリング</p></td><td><p>原則㎡単位</p><p>毀損等が複数箇所の場合は、居室全体</p></td><td><p>（フローリング）</p><p>補修は経過年数を考慮しない。</p><p>（フローリング全体にわたる毀損等があり、張り替える場合は、当該建物の耐用年数で残存価値１円となるような負担割合を算定する。）</p></td></tr><tr><td rowspan=\"2\"><p>壁・天井(クロス)</p></td><td rowspan=\"2\"><p>毀損部分の補修</p></td><td><p>壁（クロス）</p></td><td><p>㎡単位が望ましいが、借主が毀損した箇所を含む一面分までは張替え費用を借主負担としてもやむをえないとする。</p></td><td rowspan=\"2\"><p>（壁〔クロス〕）</p><p>６年で残存価値１円となるような負担割合を算定する。</p></td></tr><tr><td><p>タバコ等の</p><p>ヤニ、臭い</p></td><td><p>喫煙等により当該居室全体においてクロス等がヤニで変色したり臭いが付着した場合のみ、居室全体のクリーニング又は張替え費用を借主負担とすることが妥当と考えられる。</p></td></tr><tr><td rowspan=\"2\"><p>建具・柱</p></td><td rowspan=\"2\"><p>毀損部分</p><p>の補修</p></td><td><p>襖</p></td><td><p>１枚単位</p></td><td><p>（襖紙、障子紙）</p><p>経過年数は考慮しない。</p></td></tr><tr><td><p>柱</p></td><td><p>１本単位</p></td><td><p>（襖、障子等の建具部分、柱）</p><p>経過年数は考慮しない。</p></td></tr><tr><td rowspan=\"3\"><p>設備・その他</p></td><td><p>設備の</p><p>補修</p></td><td><p>設備機器</p></td><td><p>補修部分、交換相当費用</p></td><td><p>（設備機器）</p><p>耐用年数経過時点で残存価値１円となるような直線(又は曲線)を想定し、負担割合を算定する。</p></td></tr><tr><td><p>鍵の</p><p>返却</p></td><td><p>鍵</p></td><td><p>補修部分</p><p>紛失の場合は、シリンダーの交換も含む。</p></td><td><p>鍵の紛失の場合は、経過年数は考慮しない。交換費用相当分を借主負担とする。</p></td></tr><tr><td><p>通常の</p><p>清掃※</p></td><td><p>クリーニング</p><p>※通常の清掃や退去時の清掃を怠った場合のみ</p></td><td><p>部位ごと、又は住戸全体</p></td><td><p>経過年数は考慮しない。借主負担となるのは、通常の清掃を実施していない場合で、部位又は住戸全体の清掃費用相当分を借主負担とする。</p></td></tr></table><p>設備等の経過年数と借主負担割合（耐用年数６年及び８年、定額法の場合）</ td></tr><tr><td rowspan=\"4\"><p>設備・その他</p></td><td><p>共通</p></td><td></td><td></td><td></td></tr><tr><td><p>玄関・廊下</p></td><td></td><td></td><td></td></tr><tr><td><p>台所・キッチン</p></td><td></td><td></td><td></td></tr><tr><td><p>浴室・洗面所・トイレ</p></td><td></td><td></td><td></td></tr><tr><td colspan=\"2\"><p>その他</p></td><td></td><td></td><td></td></tr></table><p>※この単価は、あくまでも目安であり、入居時における借主・貸主双方で負担の概算額を認識するためのものです。</p><p>※従って、退去時においては、資材の価格や在庫状況の変動、毀損の程度や原状回復施工方法等を考慮して、借主・貸主双方で協議した施工単価で原状回復工事を実施することとなります。</p><p>Ⅱ　例外としての特約</p><p>原状回復に関する費用の一般原則は上記のとおりですが、借主は、例外として、下記の費用については、借主の負担とすることに合意します（ただし、民法第90条並びに消費者契約法第８条、第８条の２、第９条及び第10条に反しない内容に限ります）。</p>{{TOKUYAKU5}}<p class=\"small\">（括弧内は、本来は貸主が負担すべきものである費用を、特別に借主が負担することとする理由。）</p></div>", "sign_intro": "下記貸主（甲）と借主（乙）は、本物件について上記のとおり賃貸借契約を締結したことを証するため、本契約書２通を作成し、甲乙記名押印の上、各自その１通を保有する。", "setsumei": ["下記住宅について定期建物賃貸借契約を締結するに当たり、借地借家法第38条第３項に基づき、次のとおり説明します。", "下記住宅の賃貸借契約は、更新がなく、期間の満了により賃貸借は終了しますので、期間の満了の日の翌日を始期とする新たな賃貸借契約（再契約）を締結する場合を除き、期間の満了の日までに、下記住宅を明け渡さなければなりません。", "上記住宅につきまして、借地借家法第38条第３項に基づく説明を受けました。"], "tsuchi_body": ["私が賃貸している下記住宅については、　　　　年　　月　　日に期間の満了により賃貸借が終了します。", "［なお、本物件については、期間の満了の日の翌日を始期とする新たな賃貸借契約（再契約）を締結する意向があることを申し添えます。］"], "tsuchi_head": "（借地借家法第38条第６項、定期賃貸住宅標準契約書第２条第３項関係）"}, "teiki_hosho": {"title": "定期賃貸住宅標準契約書", "type": "定期借家", "guarantee": "連帯保証人", "word": "https://www.mlit.go.jp/common/001479800.docx", "pdf": "https://www.mlit.go.jp/common/001479831.pdf", "page": "https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000030.html", "articles": [{"kind": "head", "text": "（契約の締結）"}, {"kind": "p", "text": "第１条　貸主（以下「甲」という。）及び借主（以下「乙」という。）は、頭書（１）に記載する賃貸借の目的物（以下「本物件」という。）について、以下の条項により借地借家法（以下「法」という。）第38条に規定する定期建物賃貸借契約（以下「本契約」という。）を締結した。"}, {"kind": "head", "text": "（契約期間）"}, {"kind": "p", "text": "第２条　契約期間は、頭書（２）に記載するとおりとする。"}, {"kind": "p", "text": "２　本契約は、前項に規定する期間の満了により終了し、更新がない。ただし、甲及び乙は、協議の上、本契約の期間の満了の日の翌日を始期とする新たな賃貸借契約（以下「再契約」という。）をすることができる。"}, {"kind": "p", "text": "３　甲は、第１項に規定する期間の満了の１年前から６月前までの間（以下「通知期間」という。）に乙に対し、期間の満了により賃貸借が終了する旨を書面によって通知するものとする。"}, {"kind": "p", "text": "４　甲は、前項に規定する通知をしなければ、賃貸借の終了を乙に主張することができず、乙は、第１項に規定する期間の満了後においても、本物件を引き続き賃借することができる。ただし、甲が通知期間の経過後乙に対し期間の満了により賃貸借が終了する旨の通知をした場合においては、その通知の日から６月を経過した日に賃貸借は終了する。"}, {"kind": "head", "text": "（使用目的）"}, {"kind": "p", "text": "第３条　乙は、居住のみを目的として本物件を使用しなければならない。"}, {"kind": "head", "text": "（賃料）"}, {"kind": "p", "text": "第４条　乙は、頭書（３）の記載に従い、賃料を甲に支払わなければならない。"}, {"kind": "p", "text": "２　１か月に満たない期間の賃料は、１か月を30日として日割計算した額とする。"}, {"kind": "p", "text": "３　甲及び乙は、次の各号の一に該当する場合には、協議の上、賃料を改定することができる。"}, {"kind": "p", "text": "一　土地又は建物に対する租税その他の負担の増減により賃料が不相当となった場合"}, {"kind": "p", "text": "二　土地又は建物の価格の上昇又は低下その他の経済事情の変動により賃料が不相当となった場合"}, {"kind": "p", "text": "三　近傍同種の建物の賃料に比較して賃料が不相当となった場合"}, {"kind": "head", "text": "（共益費）"}, {"kind": "p", "text": "第５条　乙は、階段、廊下等の共用部分の維持管理に必要な光熱費、上下水道使用料、清掃費等（以下この条において「維持管理費」という。）に充てるため、共益費を甲に支払うものとする。"}, {"kind": "p", "text": "２　前項の共益費は、頭書（３）の記載に従い、支払わなければならない。"}, {"kind": "p", "text": "３　１か月に満たない期間の共益費は、１か月を30日として日割計算した額とする。"}, {"kind": "p", "text": "４　甲及び乙は、維持管理費の増減により共益費が不相当となったときは、協議の上、共益費を改定することができる。"}, {"kind": "head", "text": "（敷金）"}, {"kind": "p", "text": "第６条　乙は、本契約から生じる債務の担保として、頭書（３）に記載する敷金を甲に交付するものとする。"}, {"kind": "p", "text": "２　甲は、乙が本契約から生じる債務を履行しないときは、敷金をその債務の弁済に充てることができる。この場合において、乙は、本物件を明け渡すまでの間、敷金をもって当該債務の弁済に充てることを請求することができない。"}, {"kind": "p", "text": "３　甲は、本物件の明渡しがあったときは、遅滞なく、敷金の全額を乙に返還しなければならない。ただし、本物件の明渡し時に、賃料の滞納、第15条に規定する原状回復に要する費用の未払いその他の本契約から生じる乙の債務の不履行が存在する場合には、甲は、当該債務の額を敷金から差し引いた額を返還するものとする。"}, {"kind": "p", "text": "４　前項ただし書の場合には、甲は、敷金から差し引く債務の額の内訳を乙に明示しなければならない。"}, {"kind": "head", "text": "（反社会的勢力の排除）"}, {"kind": "p", "text": "第７条　甲及び乙は、それぞれ相手方に対し、次の各号の事項を確約する。"}, {"kind": "p", "text": "一　自らが、暴力団、暴力団関係企業、総会屋若しくはこれらに準ずる者又はその構成員（以下総称して「反社会的勢力」という。）ではないこと。"}, {"kind": "p", "text": "二　自らの役員（業務を執行する社員、取締役、執行役又はこれらに準ずる者をいう。）が反社会的勢力ではないこと。"}, {"kind": "p", "text": "三　反社会的勢力に自己の名義を利用させ、この契約を締結するものでないこと。"}, {"kind": "p", "text": "四　自ら又は第三者を利用して、次の行為をしないこと。"}, {"kind": "p", "text": "ア　相手方に対する脅迫的な言動又は暴力を用いる行為"}, {"kind": "p", "text": "イ　偽計又は威力を用いて相手方の業務を妨害し、又は信用を毀損する行為"}, {"kind": "p", "text": "２　乙は、甲の承諾の有無にかかわらず、本物件の全部又は一部につき、反社会的勢力に賃借権を譲渡し、又は転貸してはならない。"}, {"kind": "head", "text": "（禁止又は制限される行為）"}, {"kind": "p", "text": "第８条　乙は、甲の書面による承諾を得ることなく、本物件の全部又は一部につき、賃借権を譲渡し、又は転貸してはならない。"}, {"kind": "p", "text": "２　乙は、甲の書面による承諾を得ることなく、本物件の増築、改築、移転、改造若しくは模様替又は本物件の敷地内における工作物の設置を行ってはならない。"}, {"kind": "p", "text": "３　乙は、本物件の使用に当たり、別表第１に掲げる行為を行ってはならない。"}, {"kind": "p", "text": "４　乙は、本物件の使用に当たり、甲の書面による承諾を得ることなく、別表第２に掲げる行為を行ってはならない。"}, {"kind": "p", "text": "５　乙は、本物件の使用に当たり、別表第３に掲げる行為を行う場合には、甲に通知しなければならない。"}, {"kind": "head", "text": "（契約期間中の修繕）"}, {"kind": "p", "text": "第９条　甲は、乙が本物件を使用するために必要な修繕を行わなければならない。この場合の修繕に要する費用については、乙の責めに帰すべき事由により必要となったものは乙が負担し、その他のものは甲が負担するものとする。"}, {"kind": "p", "text": "２　前項の規定に基づき甲が修繕を行う場合は、甲は、あらかじめ、その旨を乙に通知しなければならない。この場合において、乙は、正当な理由がある場合を除き、当該修繕の実施を拒否することができない。"}, {"kind": "p", "text": "３　乙は、本物件内に修繕を要する箇所を発見したときは、甲にその旨を通知し修繕の必要について協議するものとする。"}, {"kind": "p", "text": "４　前項の規定による通知が行われた場合において、修繕の必要が認められるにもかかわらず、甲が正当な理由なく修繕を実施しないときは、乙は自ら修繕を行うことができる。この場合の修繕に要する費用については、第１項に準ずるものとする。"}, {"kind": "p", "text": "５　乙は、別表第４に掲げる修繕について、第１項に基づき甲に修繕を請求するほか、自ら行うことができる。乙が自ら修繕を行う場合においては、修繕に要する費用は乙が負担するものとし、甲への通知及び甲の承諾を要しない。"}, {"kind": "head", "text": "（契約の解除）"}, {"kind": "p", "text": "第10条　甲は、乙が次に掲げる義務に違反した場合において、甲が相当の期間を定めて当該義務の履行を催告したにもかかわらず、その期間内に当該義務が履行されないときは、本契約を解除することができる。"}, {"kind": "p", "text": "一　第４条第１項に規定する賃料支払義務"}, {"kind": "p", "text": "二　第５条第２項に規定する共益費支払義務"}, {"kind": "p", "text": "三　前条第１項後段に規定する乙の費用負担義務"}, {"kind": "p", "text": "２　甲は、乙が次に掲げる義務に違反した場合において、甲が相当の期間を定めて当該義務の履行を催告したにもかかわらず、その期間内に当該義務が履行されずに当該義務違反により本契約を継続することが困難であると認められるに至ったときは、本契約を解除することができる。"}, {"kind": "p", "text": "一　第３条に規定する本物件の使用目的遵守義務"}, {"kind": "p", "text": "二　第８条各項に規定する義務（同条第３項に規定する義務のうち、別表第１第六号から第八号に掲げる行為に係るものを除く。）"}, {"kind": "p", "text": "三　その他本契約書に規定する乙の義務"}, {"kind": "p", "text": "３　甲又は乙の一方について、次のいずれかに該当した場合には、その相手方は、何らの催告も要せずして、本契約を解除することができる。"}, {"kind": "p", "text": "一　第７条第１項各号の確約に反する事実が判明した場合"}, {"kind": "p", "text": "二　契約締結後に自ら又は役員が反社会的勢力に該当した場合"}, {"kind": "p", "text": "４　甲は、乙が第７条第２項に規定する義務に違反した場合又は別表第１第六号から第八号に掲げる行為を行った場合には、何らの催告も要せずして、本契約を解除することができる。"}, {"kind": "head", "text": "（乙からの解約）"}, {"kind": "p", "text": "第11条　乙は、甲に対して少なくとも１月前に解約の申入れを行うことにより、本契約を解約することができる。"}, {"kind": "p", "text": "２　前項の規定にかかわらず、乙は、解約申入れの日から１月分の賃料（本契約の解約後の賃料相当額を含む。）を甲に支払うことにより、解約申入れの日から起算して１月を経過する日までの間、随時に本契約を解約することができる。"}, {"kind": "head", "text": "（一部滅失等による賃料の減額等）"}, {"kind": "p", "text": "第12条　本物件の一部が滅失その他の事由により使用できなくなった場合において、それが乙の責めに帰することができない事由によるものであるときは、賃料は、その使用できなくなった部分の割合に応じて、減額されるものとする。この場合において、甲及び乙は、減額の程度、期間その他必要な事項について協議するものとする。"}, {"kind": "p", "text": "２　本物件の一部が滅失その他の事由により使用できなくなった場合において、残存する部分のみでは乙が賃借をした目的を達することができないときは、乙は、本契約を解除することができる。"}, {"kind": "head", "text": "（契約の終了）"}, {"kind": "p", "text": "第13条　本契約は、本物件の全部が滅失その他の事由により使用できなくなった場合には、これによって終了する。"}, {"kind": "head", "text": "（明渡し）"}, {"kind": "p", "text": "第14条　乙は、本契約が終了する日（甲が第2条第３項に規定する通知をしなかった場合においては、同条第４項ただし書に規定する通知をした日から６月を経過した日）までに（第10条の規定に基づき本契約が解除された場合にあっては、直ちに）、本物件を明け渡さなければならない。"}, {"kind": "p", "text": "２　乙は、前項の明渡しをするときには、明渡し日を事前に甲に通知しなければならない。"}, {"kind": "head", "text": "（明渡し時の原状回復）"}, {"kind": "p", "text": "第15条　乙は、通常の使用に伴い生じた本物件の損耗及び本物件の経年変化を除き、本物件を原状回復しなければならない。ただし、乙の責めに帰することができない事由により生じたものについては、原状回復を要しない。"}, {"kind": "p", "text": "２　甲及び乙は、本物件の明渡し時において、契約時に特約を定めた場合は当該特約を含め、別表第５の規定に基づき乙が行う原状回復の内容及び方法について協議するものとする。"}, {"kind": "head", "text": "（立入り）"}, {"kind": "p", "text": "第16条　甲は、本物件の防火、本物件の構造の保全その他の本物件の管理上特に必要があるときは、あらかじめ乙の承諾を得て、本物件内に立ち入ることができる。"}, {"kind": "p", "text": "２　乙は、正当な理由がある場合を除き、前項の規定に基づく甲の立入りを拒否することはできない。"}, {"kind": "p", "text": "３　本契約終了後において本物件を賃借しようとする者又は本物件を譲り受けようとする者が下見をするときは、甲及び下見をする者は、あらかじめ乙の承諾を得て、本物件内に立ち入ることができる。"}, {"kind": "p", "text": "４　甲は、火災による延焼を防止する必要がある場合その他の緊急の必要がある場合においては、あらかじめ乙の承諾を得ることなく、本物件内に立ち入ることができる。この場合において、甲は、乙の不在時に立ち入ったときは、立入り後その旨を乙に通知しなければならない。"}, {"kind": "head", "text": "（連帯保証人）"}, {"kind": "p", "text": "第17条　連帯保証人（以下「丙」という。）は、乙と連帯して、本契約から生じる乙の債務（甲が第２条第３項に規定する通知をしなかった場合においては、同条第１項に規定する期間内のものに限る。）を負担するものとする。"}, {"kind": "p", "text": "２　前項の丙の負担は、頭書（６）及び記名押印欄に記載する極度額を限度とする。"}, {"kind": "p", "text": "３　丙が負担する債務の元本は、乙又は丙が死亡したときに、確定するものとする。"}, {"kind": "p", "text": "４　丙の請求があったときは、甲は、丙に対し、遅滞なく、賃料及び共益費等の支払状況や滞納金の額、損害賠償の額等、乙の全ての債務の額等に関する情報を提供しなければならない。"}, {"kind": "head", "text": "（再契約）"}, {"kind": "p", "text": "第18条　甲は、再契約の意向があるときは、第２条第３項に規定する通知の書面に、その旨を付記するものとする。"}, {"kind": "p", "text": "２　再契約をした場合は、第14条の規定は適用しない。この場合において、本契約における原状回復の債務の履行については、再契約に係る賃貸借が終了する日までに行うこととし、敷金の返還については、明渡しがあったものとして第６条第３項に規定するところによる。"}, {"kind": "head", "text": "（協議）"}, {"kind": "p", "text": "第19条　甲及び乙は、本契約書に定めがない事項及び本契約書の条項の解釈について疑義が生じた場合は、民法その他の法令及び慣行に従い、誠意をもって協議し、解決するものとする。"}, {"kind": "head", "text": "（特約条項）"}, {"kind": "p", "text": "第20条　第19条までの規定以外に、本契約の特約については、下記のとおりとする。"}], "beppyo": [{"title": "別表第１（第８条第３項関係）", "lines": ["一　銃砲、刀剣類又は爆発性、発火性を有する危険な物品等を製造又は保管すること。", "二　大型の金庫その他の重量の大きな物品等を搬入し、又は備え付けること。", "三　排水管を腐食させるおそれのある液体を流すこと。", "四　大音量でテレビ、ステレオ等の操作、ピアノ等の演奏を行うこと。", "五　猛獣、毒蛇等の明らかに近隣に迷惑をかける動物を飼育すること。", "六　本物件を、反社会的勢力の事務所その他の活動の拠点に供すること。", "七　本物件又は本物件の周辺において、著しく粗野若しくは乱暴な言動を行い、又は威勢を示すことにより、付近の住民又は通行人に不安を覚えさせること。", "八　本物件に反社会的勢力を居住させ、又は反復継続して反社会的勢力を出入りさせること。"]}, {"title": "別表第２（第８条第４項関係）", "lines": ["一　階段、廊下等の共用部分に物品を置くこと。", "二　階段、廊下等の共用部分に看板、ポスター等の広告物を掲示すること。", "三　観賞用の小鳥、魚等であって明らかに近隣に迷惑をかけるおそれのない動物以外の犬、猫等の動物（別表第１第五号に掲げる動物を除く。）を飼育すること。"]}, {"title": "別表第３（第８条第５項関係）", "lines": ["一　頭書（５）に記載する同居人に新たな同居人を追加（出生を除く。）すること。", "二　１か月以上継続して本物件を留守にすること。"]}, {"title": "別表第４（第９条第５項関係）", "lines": ["ヒューズの取替え", "蛇口のパッキン、コマの取替え", "風呂場等のゴム栓、鎖の取替え", "電球、蛍光灯の取替え", "その他費用が軽微な修繕"]}], "beppyo5": "<div class=\"kb\"><p>【原状回復の条件について】</p><p>本物件の原状回復条件は、下記Ⅱの「例外としての特約」による以外は、賃貸住宅の原状回復に関する費用負担の一般原則の考え方によります。すなわち、</p><p>・　借主の故意・過失、善管注意義務違反、その他通常の使用方法を超えるような使用による損耗等については、借主が負担すべき費用となる。なお、震災等の不可抗力による損耗、上階の居住者など借主と無関係な第三者がもたらした損耗等については、借主が負担すべきものではない。</p><p>・　建物・設備等の自然的な劣化・損耗等（経年変化）及び借主の通常の使用により生ずる損耗等（通常損耗）については、貸主が負担すべき費用となる</p><p>ものとします。</p><p>その具体的内容は、国土交通省の「原状回復をめぐるトラブルとガイドライン（再改訂版）」において定められた別表１及び別表2のとおりですが、その概要は、下記Ⅰのとおりです。</p><p>Ⅰ　本物件の原状回復条件</p><p>（ただし、民法第90条並びに消費者契約法第８条、第８条の２、第9条及び第10条に反しない内容に関して、下記Ⅱの「例外としての特約」の合意がある場合は、その内容によります。）</p><p>　１　貸主・借主の修繕分担表</p><table class=\"kt\"><tr><td><p>貸主の負担となるもの</p></td><td><p>借主の負担となるもの</p></td></tr><tr><td colspan=\"2\"><p>【床（畳・フローリング・カーペットなど）】</p></td></tr><tr><td><p>１．畳の裏返し、表替え（特に破損してないが、次の入居者確保のために行うもの）</p><p>２．フローリングのワックスがけ</p><p>３．家具の設置による床、カーペットのへこみ、設置跡</p><p>４．畳の変色、フローリングの色落ち（日照、建物構造欠陥による雨漏りなどで発生したもの）</p></td><td><p>１．カーペットに飲み物等をこぼしたことによるシミ、カビ（こぼした後の手入れ不足等の場合）</p><p>２．冷蔵庫下のサビ跡（サビを放置し、床に汚損等の損害を与えた場合）</p><p>３．引越作業等で生じた引っかきキズ</p><p>４．フローリングの色落ち（借主の不注意で雨が吹き込んだことなどによるもの）</p></td></tr><tr><td colspan=\"2\"><p>【壁、天井（クロスなど）】</p></td></tr><tr><td><p>１．テレビ、冷蔵庫等の後部壁面の黒ずみ（いわゆる電気ヤケ）</p><p>２．壁に貼ったポスターや絵画の跡</p><p>３．壁等の画鋲、ピン等の穴（下地ボードの張替えは不要な程度のもの）</p><p>４．エアコン（借主所有）設置による壁のビス穴、跡</p><p>５．クロスの変色（日照などの自然現象によるもの）</p></td><td><p>１．借主が日常の清掃を怠ったための台所の油汚れ（使用後の手入れが悪く、ススや油が付着している場合）</p><p>２．借主が結露を放置したことで拡大したカビ、シミ（貸主に通知もせず、かつ、拭き取るなどの手入れを怠り、壁等を腐食させた場合）</p><p>３．クーラーから水漏れし、借主が放置したため壁が腐食</p><p>４．タバコ等のヤニ、臭い（喫煙等によりクロス等が変色したり、臭いが付着している場合）</p><p>５．壁等のくぎ穴、ネジ穴（重量物をかけるためにあけたもので、下地ボードの張替えが必要な程度のもの）</p><p>６．借主が天井に直接つけた照明器具の跡</p><p>７．落書き等の故意による毀損</p></td></tr><tr><td colspan=\"2\"><p>【建具等、襖、柱等】</p></td></tr><tr><td><p>１．網戸の張替え（特に破損はしてないが、次の入居者確保のために行うもの）</p><p>２．地震で破損したガラス</p><p>３．網入りガラスの亀裂（構造により自然に発生したもの）</p></td><td><p>１．飼育ペットによる柱等のキズ、臭い（ペットによる柱、クロス等にキズが付いたり、臭いが付着している場合）</p><p>２．落書き等の故意による毀損</p></td></tr><tr><td colspan=\"2\"><p>【設備、その他】</p></td></tr><tr><td><p>１．専門業者による全体のハウスクリーニング（借主が通常の清掃を実施している場合）</p><p>２．エアコンの内部洗浄（喫煙等の臭いなどが付着していない場合）</p><p>３．消毒（台所・トイレ）</p><p>４．浴槽、風呂釜等の取替え（破損等はしていないが、次の入居者確保のために行うもの）</p><p>５．鍵の取替え（破損、鍵紛失のない場合）</p><p>６．設備機器の故障、使用不能（機器の寿命によるもの）</p></td><td><p>１．ガスコンロ置き場、換気扇等の油汚れ、すす（借主が清掃・手入れを怠った結果汚損が生じた場合）</p><p>２．風呂、トイレ、洗面台の水垢、カビ等（借主が清掃・手入れを怠った結果汚損が生じた場合）</p><p>３．日常の不適切な手入れ又は用法違反による設備の毀損</p><p>４．鍵の紛失又は破損による取替え</p><p>５．戸建賃貸住宅の庭に生い茂った雑草</p></td></tr></table></div><div class=\"kb\"><p>　２　借主の負担単位</p><table class=\"kt\"><tr><td colspan=\"2\"><p>負担</p><p>内容</p></td><td colspan=\"2\"><p>借主の負担単位</p></td><td><p>経過年数等の考慮</p></td></tr><tr><td rowspan=\"3\"><p>床</p></td><td rowspan=\"3\"><p>毀損部分の補修</p></td><td><p>畳</p></td><td><p>原則一枚単位</p><p>毀損部分が複数枚の場合はその枚数分（裏返しか表替えかは、毀損の程度による）</p></td><td><p>（畳表）</p><p>経過年数は考慮しない。</p></td></tr><tr><td><p>カーペット</p><p>クッション　フロア</p></td><td><p>毀損等が複数箇所の場合は、居室全体</p></td><td><p>（畳床・カーペット・クッションフロア）</p><p>６年で残存価値１円となるような負担割合を算定する。</p></td></tr><tr><td><p>フローリング</p></td><td><p>原則㎡単位</p><p>毀損等が複数箇所の場合は、居室全体</p></td><td><p>（フローリング）</p><p>補修は経過年数を考慮しない。</p><p>（フローリング全体にわたる毀損等があり、張り替える場合は、当該建物の耐用年数で残存価値１円となるような負担割合を算定する。）</p></td></tr><tr><td rowspan=\"2\"><p>壁・天井(クロス)</p></td><td rowspan=\"2\"><p>毀損部分の補修</p></td><td><p>壁（クロス）</p></td><td><p>㎡単位が望ましいが、借主が毀損した箇所を含む一面分までは張替え費用を借主負担としてもやむをえないとする。</p></td><td rowspan=\"2\"><p>（壁〔クロス〕）</p><p>６年で残存価値１円となるような負担割合を算定する。</p></td></tr><tr><td><p>タバコ等の</p><p>ヤニ、臭い</p></td><td><p>喫煙等により当該居室全体においてクロス等がヤニで変色したり臭いが付着した場合のみ、居室全体のクリーニング又は張替え費用を借主負担とすることが妥当と考えられる。</p></td></tr><tr><td rowspan=\"2\"><p>建具・柱</p></td><td rowspan=\"2\"><p>毀損部分</p><p>の補修</p></td><td><p>襖</p></td><td><p>１枚単位</p></td><td><p>（襖紙、障子紙）</p><p>経過年数は考慮しない。</p></td></tr><tr><td><p>柱</p></td><td><p>１本単位</p></td><td><p>（襖、障子等の建具部分、柱）</p><p>経過年数は考慮しない。</p></td></tr><tr><td rowspan=\"3\"><p>設備・その他</p></td><td><p>設備の</p><p>補修</p></td><td><p>設備機器</p></td><td><p>補修部分、交換相当費用</p></td><td><p>（設備機器）</p><p>耐用年数経過時点で残存価値１円となるような直線(又は曲線)を想定し、負担割合を算定する。</p></td></tr><tr><td><p>鍵の</p><p>返却</p></td><td><p>鍵</p></td><td><p>補修部分</p><p>紛失の場合は、シリンダーの交換も含む。</p></td><td><p>鍵の紛失の場合は、経過年数は考慮しない。交換費用相当分を借主負担とする。</p></td></tr><tr><td><p>通常の</p><p>清掃※</p></td><td><p>クリーニング</p><p>※通常の清掃や退去時の清掃を怠った場合のみ</p></td><td><p>部位ごと、又は住戸全体</p></td><td><p>経過年数は考慮しない。借主負担となるのは、通常の清掃を実施していない場合で、部位又は住戸全体の清掃費用相当分を借主負担とする。</p></td></tr></table><p>設備等の経過年数と借主負担割合（耐用年数６年及び８年、定額法の場合）</p><p>借主負担割合（原状回復義務がある場合）</p><p cla 備・その他</p></td><td><p>共通</p></td><td></td><td></td><td></td></tr><tr><td><p>玄関・廊下</p></td><td></td><td></td><td></td></tr><tr><td><p>台所・キッチン</p></td><td></td><td></td><td></td></tr><tr><td><p>浴室・洗面所・トイレ</p></td><td></td><td></td><td></td></tr><tr><td colspan=\"2\"><p>その他</p></td><td></td><td></td><td></td></tr></table><p>※この単価は、あくまでも目安であり、入居時における借主・貸主双方で負担の概算額を認識するためのものです。</p><p>※従って、退去時においては、資材の価格や在庫状況の変動、毀損の程度や原状回復施工方法等を考慮して、借主・貸主双方で協議した施工単価で原状回復工事を実施することとなります。</p><p>Ⅱ　例外としての特約</p><p>原状回復に関する費用の一般原則は上記のとおりですが、借主は、例外として、下記の費用については、借主の負担とすることに合意します（ただし、民法第90条並びに消費者契約法第８条、第８条の２、第９条及び第10条に反しない内容に限ります）。</p>{{TOKUYAKU5}}<p class=\"small\">（括弧内は、本来は貸主が負担すべきものである費用を、特別に借主が負担することとする理由。）</p></div>", "sign_intro": "下記貸主（甲）と借主（乙）は、本物件について上記のとおり賃貸借契約を締結し、また甲と連帯保証人（丙）は、上記のとおり乙の債務について保証契約を締結したことを証するため、本契約書３通を作成し、甲乙丙記名押印の上、各自その１通を保有する。", "setsumei": ["下記住宅について定期建物賃貸借契約を締結するに当たり、借地借家法第38条第３項に基づき、次のとおり説明します。", "下記住宅の賃貸借契約は、更新がなく、期間の満了により賃貸借は終了しますので、期間の満了の日の翌日を始期とする新たな賃貸借契約（再契約）を締結する場合を除き、期間の満了の日までに、下記住宅を明け渡さなければなりません。", "上記住宅につきまして、借地借家法第38条第３項に基づく説明を受けました。"], "tsuchi_body": ["私が賃貸している下記住宅については、　　　　年　　月　　日に期間の満了により賃貸借が終了します。", "［なお、本物件については、期間の満了の日の翌日を始期とする新たな賃貸借契約（再契約）を締結する意向があることを申し添えます。］"], "tsuchi_head": "（借地借家法第38条第６項、定期賃貸住宅標準契約書第２条第３項関係）"}};</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='misaneco_chintai_v1',SP='　　　　';
let st={},vt='futsu',vg='hosho';
const V=()=>DATA[vt+'_'+vg];
// ---- 数字：全角も読み取る
const hasZen=s=>/[０-９，．]/.test(String(s??''));
const num=s=>{s=String(s??'').replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[，,円\s]/g,'').replace(/．/g,'.');return s===''||isNaN(s)?null:Number(s)};
const yen=n=>n==null?'':Number(n).toLocaleString('ja-JP');
const g=k=>st[k]??'';
const B=(x,w=SP)=>x===''||x==null?`<span>${w}</span>`:`<span class="fv">${esc(x)}</span>`;
// ---- 日付
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const wa=s=>{const d=pd(s);return d?`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`:'　　　　年　　月　　日'};
function addMonths(s,n){const d=pd(s);if(!d)return '';const day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return iso(t)}
function addDays(s,n){const d=pd(s);if(!d)return '';d.setDate(d.getDate()+n);return iso(d)}
function today(){return iso(new Date())}
function months(){return (num(g('p_y'))||0)*12+(num(g('p_m'))||0)}
function endAuto(){const m=months();return g('p_start')&&m>0?addDays(addMonths(g('p_start'),m),-1):''}
function endDate(){return g('p_end')||endAuto()}
// 通知期間：期間の満了の1年前から6か月前まで（目安）
function notice(){const e=endDate();return e?[addMonths(e,-12),addMonths(e,-6)]:['','']}
// ---- 入力欄の定義
const EQUIP=['トイレ','浴室','シャワー','洗面台','洗濯機置場','給湯設備','ガスコンロ・電気コンロ・IH調理器','冷暖房設備','備え付け照明設備','オートロック','地デジ対応・CATV対応','インターネット対応','メールボックス','宅配ボックス','鍵'];

const UMU=['有','無'];
function F(id,label,o={}){return {id,label,...o}}

    ['g2',F('b_tate','建て方',{sel:['共同建','長屋建','一戸建','その他']}),F('b_kozo','構造',{sel:['木造','非木造']})],

    ['g3',F('b_kai','階建',{n:1}),F('b_ko','戸数',{n:1}),F('b_nen','工事完了年',{ph:'2015'})],

    ['h','設備等（有・無）'],
    F('eq_toilet','トイレ',{sel:['専用（水洗）','専用（非水洗）','共用（水洗）','共用（非水洗）']}),
    ...EQUIP.slice(1).map((e,i)=>F('eq_'+(i+1),e,{sel:UMU})),

    ['g3',F('kyo','共益費（円）',{n:1}),F('kyo_w','',{sel:['当月分','翌月分'],lab:'支払う月'}),F('kyo_d','毎月○日まで',{n:1})],

  ['（５）借主及び同居人',[

function inp(f){

function renderForm(){

function checks(){
  const c=[],teiki=vt==='teiki',hosho=vg==='hosho';
  allFields().filter(f=>f.req&&!(f.id==='g_kyoku')).forEach(f=>{if(!g(f.id))c.push(['err',`「${f.label}」が空欄です`])});
  if(hosho){const k=g('g_kyoku');
    if(!k)c.push(['err','連帯保証人の極度額が空欄です。個人の連帯保証人は、極度額を定めないと保証契約の効力が生じません（民法465条の2第2項）']);
    else if(num(k)==null||num(k)<=0)c.push(['err','極度額は金額（円）で入れてください（例：1,200,000）']);
    if(!g('g_name'))c.push(['warn','連帯保証人の氏名が空欄です'])}
  else if(!g('h_name'))c.push(['warn','家賃債務保証業者の商号（名称）が空欄です']);
  const m=months(),s=g('p_start'),e=endDate();
  if(s&&!m&&!g('p_end'))c.push(['err','契約期間（年・か月）が空欄です']);
  if(s&&e&&pd(e)<=pd(s))c.push(['err','終期が始期より前（または同じ日）になっています']);
  if(g('p_end')&&endAuto()&&g('p_end')!==endAuto())c.push(['warn',`終期（${wa(g('p_end'))}）が、始期と期間から計算した日（${wa(endAuto())}）と違います`]);
  if(s&&e&&pd(e)>pd(s)){const lt1=pd(e)<pd(addDays(addMonths(s,12),-1));
    if(!teiki&&lt1)c.push(['warn','期間が1年未満です。普通借家で期間を1年未満とすると、期間の定めがない賃貸借とみなされます（借地借家法29条1項）']);
    if(teiki&&lt1)c.push(['info','期間が1年未満の定期借家は、終了の通知（借地借家法38条6項）の対象外です']);
    if(teiki&&!lt1){const [a,b]=notice();c.push(['info',`終了の通知をする期間の目安：${wa(a)}〜${wa(b)}（期間の満了の1年前から6か月前まで）`])}}
  if(teiki){c.push(['warn','定期借家は、契約の前に「更新がなく、期間の満了で終了する」ことを、契約書とは別の書面を交付して説明する必要があります（借地借家法38条3項。説明がないと、更新がない旨の定めは無効：同5項）']);
    if(g('ex_date')&&g('sign_date')&&pd(g('ex_date'))>pd(g('sign_date')))c.push(['err','説明書の日付が、契約の日付より後になっています'])}
  const r=num(g('rent')),sm=num(g('shiki_m')),sy=num(g('shiki'));
  if(r&&sm!=null&&sy!=null&&Math.round(r*sm)!==sy)c.push(['warn',`敷金：賃料 ${yen(r)}円 × ${sm}か月 = ${yen(Math.round(r*sm))}円 ですが、${yen(sy)}円 になっています`]);
  if(g('sign_date')&&s&&pd(g('sign_date'))>pd(s))c.push(['warn','契約の日付が始期より後です。入居の前に契約を結ぶのが通常です']);
  if(g('pay')==='振込'&&!g('bank'))c.push(['warn','支払方法が「振込」ですが、振込先金融機関名が空欄です']);
  if(g('pay')==='持参'&&!g('jisan'))c.push(['warn','支払方法が「持参」ですが、持参先が空欄です']);
  const dn=[1,2,3].filter(i=>g('d'+i+'_name')).length;
  if(g('d_total')&&num(g('d_total'))!==dn+1)c.push(['warn',`合計人数（${g('d_total')}人）が、借主と同居人の人数（${dn+1}人）と違います`]);
  if(g('m_name')&&!g('m_rn'))c.push(['info','管理業者の賃貸住宅管理業者登録番号が空欄です（登録がある場合は記入）']);
  const zen=allFields().filter(f=>f.n&&hasZen(g(f.id))).map(f=>f.label);
  if(zen.length)c.push(['info',`全角の数字を半角として読み取りました：${zen.join('、')}`]);
  allFields().filter(f=>f.n&&g(f.id)&&num(g(f.id))==null).forEach(f=>c.push(['err',`「${f.label}」は数字で入れてください（今：${g(f.id)}）`]));
  return c;
}

function setsumei(){
  const d=V();
  return `<div class="page"><p class="small">定期賃貸住宅契約についての説明（借地借家法第38条第３項関係）</p><p class="right">${wa(g('ex_date'))}</p><h1 style="font-size:17px">定期賃貸住宅契約についての説明</h1>

}
function tsuchi(){
  const d=V(),e=pd(endDate());
  let body=d.tsuchi_body[0].replace('　　　　年　　月　　日',e?wa(endDate()):'　　　　年　　月　　日');
  return `<div class="page"><p class="small">${esc(d.tsuchi_head)}</p><p class="right">${wa(g('tc_date'))}</p><h1 style="font-size:17px">定期賃貸住宅契約終了についての通知</h1>

  <p>${esc(body)}</p>${g('tc_re').startsWith('あり')?`<p>${esc(d.tsuchi_body[1].replace(/^［|］$/g,''))}</p>`:''}${kiji()}${src()}</div>`;
}
function src(){
  if(!$('#o_src')||!$('#o_src').checked)return '';
  const d=V();
  return `<p class="src">出典：国土交通省「${esc(d.title)} 平成30年３月版・${esc(d.guarantee)}型」（${esc(d.page)}）を加工して作成。入力欄への記入内容の差し込み、頭書の表の組み方の変更、注意点・解説コメントの省略などの編集を行っています。本書面は国土交通省が作成したものではありません。</p>`;
}
function doc(){
  let h=`<div class="page">${head()}</div><div class="page">${articles()}</div><div class="page">${beppyo()}</div><div class="page">${sign()}${src()}</div>`;
  if(vt==='teiki'){if($('#o_ex')&&$('#o_ex').checked)h+=setsumei();if($('#o_tc')&&$('#o_tc').checked)h+=tsuchi()}
  return h;
}
function renderOpts(){
  const prev=k=>{const el=$('#'+k);return el?el.checked:null};
  const s=prev('o_src')??true,ex=prev('o_ex')??true,tc=prev('o_tc')??false;
  $('#opts').innerHTML=`<label class="rb"><input type="checkbox" id="o_src"${s?' checked':''}> 書面の最後に出典を入れる</label>`+(vt==='teiki'?`<label class="rb"><input type="checkbox" id="o_ex"${ex?' checked':''}> 事前説明の書面を付ける</label><label class="rb"><input type="checkbox" id="o_tc"${tc?' checked':''}> 終了通知のひな形を付ける</label>`:'');
  $('#opts').querySelectorAll('input').forEach(x=>x.onchange=update);
}
function update(){
  const O={err:0,warn:1,info:2},c=checks().sort((a,b)=>O[a[0]]-O[b[0]]),ne=c.filter(x=>x[0]==='err').length;
  $('#chk').innerHTML=(ne?'':'<li class="ok">必須の項目は入っています</li>')+c.map(([k,m])=>`<li class="${k}">${k==='err'?'エラー':k==='warn'?'確認':'参考'}：${esc(m)}</li>`).join('');
  const a=$('#auto_end');if(a){const e=endAuto();const [na,nb]=notice();a.innerHTML=e?`終期：<b>${wa(endDate())}</b>${g('p_end')?'（手入力）':'（始期と期間から計算）'}${vt==='teiki'&&endDate()?`<br>終了の通知をする期間：${wa(na)}〜${wa(nb)}`:''}`:'始期と期間を入れると、終期を計算します'}
  $('#doc').innerHTML=doc();
}
function setV(){document.querySelectorAll('#vt .tp').forEach(b=>b.classList.toggle('on',b.dataset.v===vt));document.querySelectorAll('#vg .tp').forEach(b=>b.classList.toggle('on',b.dataset.g===vg));save();renderForm();renderOpts();update()}

document.querySelectorAll('#vg .tp').forEach(b=>b.onclick=()=>{vg=b.dataset.g;setV()});
