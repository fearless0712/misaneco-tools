<script>const DATA={"一般": {"source": "https://www.mlit.go.jp/totikensangyo/const/content/001723420.pdf", "notice": "平成2年建設省告示第115号（最終改正 令和6年1月24日国土交通省告示第34号）", "type": "一般媒介契約書", "form_fields": [{"label": "依頼の内容", "text": "売却・購入・交換", "input": "選択（売却・購入・交換）"}, {"label": "契約型式の説明（枠内固定文）", "text": "この契約は、次の３つの契約型式のうち、一般媒介契約型式です。なお、依頼者は、重ねて依頼する宅地建物取引業者を明示する義務を負います。重ねて依頼する宅地建物取引業者を明示しない契約とする場合は、その旨を特約するものとします。\n・専属専任媒介契約型式\n依頼者は、目的物件の売買又は交換の媒介又は代理を、当社以外の宅地建物取引業者に重ねて依頼することができません。\n依頼者は、自ら発見した相手方と売買又は交換の契約を締結することができません。\n当社は、目的物件を国土交通大臣が指定した指定流通機構に登録します。\n・専任媒介契約型式\n依頼者は、目的物件の売買又は交換の媒介又は代理を、当社以外の宅地建物取引業者に重ねて依頼することができません。\n依頼者は、自ら発見した相手方と売買又は交換の契約を締結することができます。\n当社は、目的物件を国土交通大臣が指定した指定流通機構に登録します。\n・一般媒介契約型式\n依頼者は、目的物件の売買又は交換の媒介又は代理を、当社以外の宅地建物取引業者に重ねて依頼することができます。\n依頼者は、自ら発見した相手方と売買又は交換の契約を締結することができます。"}, {"label": "前文", "text": "依頼者甲は、この契約書及び一般媒介契約約款により、別表に表示する不動産（目的物件）に関する売買（交換）の媒介を宅地建物取引業者乙に依頼し、乙はこれを承諾します。"}, {"label": "締結日", "text": "年　月　日"}, {"label": "甲・依頼者", "text": "住所\n氏名", "inputs": ["住所", "氏名"]}, {"label": "乙・宅地建物取引業者", "text": "商号（名称）\n代表者　印\n主たる事務所の所在地\n免許証番号", "inputs": ["商号（名称）", "代表者", "主たる事務所の所在地", "免許証番号"]}, {"no": "1", "label": "依頼する乙以外の宅地建物取引業者", "text": "（商号又は名称）　（主たる事務所の所在地）", "inputs": ["商号又は名称", "主たる事務所の所在地"]}, {"no": "2", "label": "甲の通知義務", "text": "一　甲は、この媒介契約の有効期間内に１に表示する宅地建物取引業者以外の宅地建物取引業者に重ねて目的物件の売買又は交換の媒介又は代理を依頼しようとするときは、乙に対して、その旨を通知する義務を負います。\n二　甲は、この媒介契約の有効期間内に、自ら発見した相手方と売買若しくは交換の契約を締結したとき、又は乙以外の宅地建物取引業者の媒介若しくは代理によって売買若しくは交換の契約を締結させたときは、乙に対して、遅滞なくその旨を通知する義務を負います。\n三　一及び二の通知を怠った場合には、乙は、一般媒介契約約款の定めにより、甲に対して、費用の償還を請求することができます。"}, {"no": "3", "label": "成約に向けての乙の義務", "text": "一　乙は、契約の相手方との契約条件の調整等を行い、契約の成立に向けて積極的に努力します。\n二　乙は、目的物件の売買又は交換の申込みがあったときは、甲に対し、遅滞なく、その旨を報告します。"}, {"no": "4", "label": "媒介に係る乙の業務", "text": "乙は、３に掲げる義務を履行するとともに、次の業務を行います。\n一　乙は、甲に対し、目的物件を売買すべき価額又は評価額について意見を述べるときは、その根拠を明らかにして説明を行います。\n二　甲が乙に目的物件の購入又は取得を依頼した場合にあっては、乙は、甲に対し、目的物件の売買又は交換の契約が成立するまでの間に、宅地建物取引士をして、宅地建物取引業法第35条に定める重要事項について、宅地建物取引士が記名した書面を交付（宅地建物取引業法第35条第８項又は第９項の規定による提供を含みます。）して説明させます。\n三　乙は、目的物件の売買又は交換の契約が成立したときは、甲及び甲の相手方に対し、遅滞なく、宅地建物取引業法第37条に定める書面を作成し、宅地建物取引士に当該書面に記名させた上で、これを交付（宅地建物取引業法第37条第４項の規定による提供を含みます。）します。\n四　乙は、甲に対し、登記、決済手続等の目的物件の引渡しに係る事務の補助を行います。\n五　その他（＿＿＿＿）", "inputs": ["五 その他（自由記載）"]}, {"no": "5", "label": "建物状況調査を実施する者のあっせんの有無", "text": "（有・無）　＊＿＿＿＿\n＊　目的物件が既存の住宅である場合において、あっせん「無」とするときは、その理由を記入すること。\n注　建物状況調査の結果は瑕疵の有無を判定するものではなく、瑕疵がないことを保証するものでもありませんが、住宅の品質に関する情報を提供することにより、売主・買主が安心して取引ができるよう、目的物件について、目視を中心とした非破壊調査により、劣化事象等の状況を把握し、明らかにするものです。", "inputs": ["有・無の選択", "＊ 既存住宅で「無」とする場合の理由"]}, {"no": "6", "label": "指定流通機構への登録の有無", "text": "（有・無）　＊＿＿＿＿\n＊登録をする場合にあっては、当該登録をしようとする指定流通機構の名称を記入する。", "inputs": ["有・無の選択", "＊ 指定流通機構の名称"]}, {"no": "7", "label": "有効期間", "text": "この媒介契約締結後＿＿＿＿ヶ月（　年　月　日まで）とします。", "inputs": ["月数", "満了日（年月日）"]}, {"no": "8", "label": "約定報酬額", "text": "＿＿＿＿円と＿＿＿＿円を合計した額とします。\n（欄上の注記）（消費税及び地方消費税抜き報酬額）　（消費税額及び地方消費税額の合計額）", "inputs": ["消費税及び地方消費税抜き報酬額（円）", "消費税額及び地方消費税額の合計額（円）"]}, {"no": "9", "label": "約定報酬の受領の時期", "text": "＿＿＿＿とします。", "inputs": ["受領の時期"]}, {"no": "10", "label": "特約事項", "text": "", "inputs": ["特約事項（自由記載）"]}, {"label": "別表（目的物件の表示）", "layout_note": "原本は表組み。以下は欄の構成を上から順に列挙したもの（欄内の固定文字のみ。＿＿は記入欄）。", "sections": [{"name": "所有者", "fields": ["住　所", "氏　名"]}, {"name": "登記名義人", "fields": ["住　所", "氏　名"]}, {"name": "所在地", "fields": ["所在地"]}, {"name": "目的物件の表示／土地", "fields": ["実　測（㎡）", "公　簿（㎡）", "地目：宅地・田・畑・山林・雑種地・その他（　）", "権利内容：所有権・借地権"]}, {"name": "目的物件の表示／建物", "fields": ["建築面積（㎡）", "延面積（㎡）", "種類", "構造：＿＿造　＿＿葺　＿＿階建", "間取り"]}, {"name": "目的物件の表示／マンション", "fields": ["名称：＿＿　＿＿階　＿＿号室", "構造：＿＿造　＿＿階建", "タイプ：＿＿ＬＤＫ　＿＿ＤＫ", "専有面積（㎡）", "共有持分：＿＿分の＿＿"]}, {"name": "媒介価額", "fields": ["本体価額（円）", "消費税額及び地方消費税額の合計額（円）", "媒介価額　総額（円）"]}, {"name": "備考", "fields": ["備　考"]}], "buy_request_alternative": {"lead": "［ただし、買い依頼に係る媒介契約については、次の別表を使用することとして差し支えない。］", "title": "希望する条件", "columns": ["項　目", "内　容", "希　望　の　程　度"], "rows": ["物件の種類", "価　額", "広さ・間取り等", "物件の所在地"], "other": "その他の条件（希望の程度もお書き下さい。）", "note": "注　「希望の程度」の欄には、「特に強い」、「やや強い」、「普通」等と記入すること。"}}], "articles": [{"no": "第1条", "title": "（目的）", "text": "この約款は、宅地又は建物の売買又は交換の一般媒介契約について、当事者が契約の締結に際して定めるべき事項及び当事者が契約の履行に関して互いに遵守すべき事項を明らかにすることを目的とします。"}, {"no": "第2条", "title": "（当事者の表示と用語の定義）", "text": "この約款においては、媒介契約の当事者について、依頼者を「甲」、依頼を受ける宅地建物取引業者を「乙」と表示します。\n２　この約款において、「一般媒介契約」とは、甲が依頼の目的である宅地又は建物（以下「目的物件」といいます。）の売買又は交換の媒介又は代理を乙以外の宅地建物取引業者に重ねて依頼することができるものとする媒介契約をいいます。"}, {"no": "第3条", "title": "（目的物件の表示等）", "text": "目的物件を特定するために必要な表示及び目的物件を売買すべき価額又は交換すべき評価額（以下「媒介価額」といいます。）は、一般媒介契約書の別表に記載します。"}, {"no": "第4条", "title": "（重ねて依頼をする宅地建物取引業者の明示）", "text": "甲は、目的物件の売買又は交換の媒介又は代理を乙以外の宅地建物取引業者に重ねて依頼するときは、その宅地建物取引業者を乙に明示しなければなりません。\n２　一般媒介契約の締結時においてすでに依頼をしている宅地建物取引業者の商号又は名称及び主たる事務所の所在地は、一般媒介契約書に記載するものとし、その後において更に他の宅地建物取引業者に依頼をしようとするときは、甲は、その旨を乙に通知するものとします。"}, {"no": "第5条", "title": "（宅地建物取引業者の義務等）", "text": "乙は、次の事項を履行する義務を負います。\n一　契約の相手方との契約条件の調整等を行い、契約の成立に向けて積極的に努力すること。\n二　目的物件の売買又は交換の申込みがあったときは、甲に対して、遅滞なく、その旨を報告すること。\n２　乙は、前項に掲げる義務を履行するとともに、次の業務を行います。\n一　媒介価額の決定に際し、甲に、その価額に関する意見を述べるときは、根拠を示して説明を行うこと。\n二　甲が乙に目的物件の購入又は取得を依頼した場合にあっては、甲に対して、目的物件の売買又は交換の契約が成立するまでの間に、宅地建物取引士をして、宅地建物取引業法第35条に定める重要事項について、宅地建物取引士が記名した書面を交付（宅地建物取引業法第35条第８項又は第９項の規定による提供を含みます。）して説明させること。\n三　目的物件の売買又は交換の契約が成立したときは、甲及び甲の相手方に対して、遅滞なく、宅地建物取引業法第37条に定める書面を作成し、宅地建物取引士に当該書面に記名させた上で、これを交付（宅地建物取引業法第37条第４項の規定による提供を含みます。）すること。\n四　甲に対して、登記、決済手続等の目的物件の引渡しに係る事務の補助を行うこと。\n五　その他一般媒介契約書に記載する業務を行うこと。"}, {"no": "第6条", "title": "（媒介価額の変更の助言等）", "text": "媒介価額が地価や物価の変動その他事情の変更によって不適当と認められるに至ったときは、乙は、甲に対して、媒介価額の変更について根拠を示して助言します。\n２　甲は、媒介価額を変更しようとするときは、乙にその旨を通知します。この場合において、価額の変更が引上げであるとき（甲が乙に目的物件の購入又は取得を依頼した場合にあっては、引下げであるとき）は、乙の承諾を要します。\n３　乙は、前項の承諾を拒否しようとするときは、その根拠を示さなければなりません。"}, {"no": "第7条", "title": "（建物状況調査を実施する者のあっせん）", "text": "乙は、この媒介契約において建物状況調査を実施する者のあっせんを行うこととした場合にあっては、甲に対して、建物状況調査を実施する者をあっせんしなければなりません。"}, {"no": "第8条", "title": "（有効期間）", "text": "一般媒介契約の有効期間は、３ヶ月を超えない範囲で、甲乙協議の上、定めます。"}, {"no": "第9条", "title": "（指定流通機構への登録）", "text": "乙は、この媒介契約において目的物件を指定流通機構に登録することとした場合にあっては、当該目的物件を一般媒介契約書に記載する指定流通機構に登録しなければなりません。"}, {"no": "第10条", "title": "（報酬の請求）", "text": "乙の媒介によって目的物件の売買又は交換の契約が成立したときは、乙は、甲に対して、報酬を請求することができます。ただし、売買又は交換の契約が停止条件付契約として成立したときは、乙は、その条件が成就した場合にのみ報酬を請求することができます。\n２　前項の報酬の額は、国土交通省告示に定める限度額の範囲内で、甲乙協議の上、定めます。"}, {"no": "第11条", "title": "（報酬の受領の時期）", "text": "乙は、宅地建物取引業法第37条に定める書面を作成し、これを成立した契約の当事者に交付（宅地建物取引業法第37条第４項の規定による提供を含みます。）した後でなければ、前条第1項の報酬（以下「約定報酬」といいます。）を受領することができません。\n２　目的物件の売買又は交換の契約が、代金又は交換差金についての融資の不成立を解除条件として締結された後、融資の不成立が確定した場合、又は融資が不成立のときは甲が契約を解除できるものとして締結された後、融資の不成立が確定し、これを理由として甲が契約を解除した場合は、乙は、甲に、受領した約定報酬の全額を遅滞なく返還しなければなりません。ただし、これに対しては、利息は付さないこととします。"}, {"no": "第12条", "title": "（特別依頼に係る費用）", "text": "甲が乙に特別に依頼した広告の料金又は遠隔地への出張旅費は甲の負担とし、甲は、乙の請求に基づいて、その実費を支払わなければなりません。"}, {"no": "第13条", "title": "（直接取引）", "text": "一般媒介契約の有効期間内又は有効期間の満了後２年以内に、甲が乙の紹介によって知った相手方と乙を排除して目的物件の売買又は交換の契約を締結したときは、乙は、甲に対して、契約の成立に寄与した割合に応じた相当額の報酬を請求することができます。"}, {"no": "第14条", "title": "（費用償還の請求）", "text": "一般媒介契約の有効期間内に甲が乙に明示していない宅地建物取引業者に目的物件の売買又は交換の媒介又は代理を依頼し、これによって売買又は交換の契約を成立させたときは、乙は、甲に対して、一般媒介契約の履行のために要した費用の償還を請求することができます。\n２　前項の費用の額は、約定報酬額を超えることはできません。"}, {"no": "第15条", "title": "（依頼者の通知義務）", "text": "甲は、一般媒介契約の有効期間内に、自ら発見した相手方と目的物件の売買若しくは交換の契約を締結したとき、又は乙以外の宅地建物取引業者の媒介若しくは代理によって目的物件の売買若しくは交換の契約を成立させたときは、乙に対して遅滞なくその旨を通知しなければなりません。\n２　甲が前項の通知を怠った場合において、乙が売買又は交換の契約の成立後善意で甲のために一般媒介契約の事務の処理に要する費用を支出したときは、乙は、甲に対して、その費用の償還を請求することができます。"}, {"no": "第16条", "title": "（更新）", "text": "一般媒介契約の有効期間は、甲及び乙の合意に基づき、更新することができます。\n２　有効期間の更新をしようとするときは、有効期間の満了に際して甲から乙に対し文書等でその旨を申し出るものとします。\n３　前２項の規定による有効期間の更新に当たり、甲乙間で一般媒介契約の内容について別段の合意がなされなかったときは、従前の契約と同一内容の契約が成立したものとみなします。"}, {"no": "第17条", "title": "（契約の解除）", "text": "甲又は乙が一般媒介契約に定める義務の履行に関してその本旨に従った履行をしない場合には、その相手方は、相当の期間を定めて履行を催告し、その期間内に履行がないときは、一般媒介契約を解除することができます。"}, {"no": "第18条", "title": "", "text": "次のいずれかに該当する場合においては、甲は、一般媒介契約を解除することができます。\n一　乙が一般媒介契約に係る業務について信義を旨とし誠実に遂行する義務に違反したとき。\n二　乙が一般媒介契約に係る重要な事項について故意若しくは重過失により事実を告げず、又は不実のことを告げる行為をしたとき。\n三　乙が宅地建物取引業に関して不正又は著しく不当な行為をしたとき。", "note": "原本に独自の見出しなし（直前条の（契約の解除）が共通見出し）"}, {"no": "第19条", "title": "（反社会的勢力の排除）", "text": "甲及び乙は、それぞれ相手方に対し、次の事項を確約します。\n一　自らが、暴力団、暴力団関係企業、総会屋若しくはこれらに準ずる者又はその構成員（以下これらを総称して「反社会的勢力」といいます。）でないこと。\n二　自らの役員（業務を執行する社員、取締役、執行役又はこれらに準ずる者をいいます。）が反社会的勢力でないこと。\n三　反社会的勢力に自己の名義を利用させ、一般媒介契約を締結するものでないこと。\n四　一般媒介契約の有効期間内に、自ら又は第三者を利用して、次の行為をしないこと。\nイ　相手方に対する脅迫的な言動又は暴力を用いる行為\nロ　偽計又は威力を用いて相手方の業務を妨害し、又は信用を毀損する行為\n２　一般媒介契約の有効期間内に、甲又は乙が次のいずれかに該当した場合には、その相手方は、何らの催告を要せずして、一般媒介契約を解除することができます。\n一　前項第１号又は第２号の確約に反する申告をしたことが判明した場合\n二　前項第３号の確約に反し契約をしたことが判明した場合\n三　前項第４号の確約に反する行為をした場合\n３　乙が前項の規定により一般媒介契約を解除したときは、甲に対して、約定報酬額に相当する金額（既に約定報酬の一部を受領している場合は、その額を除いた額とします。なお、この媒介に係る消費税額及び地方消費税額の合計額に相当する額を除きます。）を違約金として請求することができます。"}, {"no": "第20条", "title": "（特約）", "text": "この約款に定めがない事項については、甲及び乙が協議して別に定めることができます。\n２　この約款の各条項の定めに反する特約で甲に不利なものは無効とします。"}]}, "専任": {"source": "https://www.mlit.go.jp/totikensangyo/const/content/001723420.pdf", "notice": "平成2年建設省告示第115号（最終改正 令和6年1月24日国土交通省告示第34号）", "type": "専任媒介契約書", "form_fields": [{"label": "依頼の内容", "text": "売却・購入・交換", "input": "選択（売却・購入・交換）"}, {"label": "契約型式の説明（枠内固定文）", "text": "この契約は、次の３つの契約型式のうち、専任媒介契約型式です。\n・専属専任媒介契約型式\n依頼者は、目的物件の売買又は交換の媒介又は代理を、当社以外の宅地建物取引業者に重ねて依頼することができません。\n依頼者は、自ら発見した相手方と売買又は交換の契約を締結することができません。\n当社は、目的物件を国土交通大臣が指定した指定流通機構に登録します。\n・専任媒介契約型式\n依頼者は、目的物件の売買又は交換の媒介又は代理を、当社以外の宅地建物取引業者に重ねて依頼することができません。\n依頼者は、自ら発見した相手方と売買又は交換の契約を締結することができます。\n当社は、目的物件を国土交通大臣が指定した指定流通機構に登録します。\n・一般媒介契約型式\n依頼者は、目的物件の売買又は交換の媒介又は代理を、当社以外の宅地建物取引業者に重ねて依頼することができます。\n依頼者は、自ら発見した相手方と売買又は交換の契約を締結することができます。"}, {"label": "前文", "text": "依頼者甲は、この契約書及び専任媒介契約約款により、別表に表示する不動産（目的物件）に関する売買（交換）の媒介を宅地建物取引業者乙に依頼し、乙はこれを承諾します。"}, {"label": "締結日", "text": "年　月　日"}, {"label": "甲・依頼者", "text": "住所\n氏名", "inputs": ["住所", "氏名"]}, {"label": "乙・宅地建物取引業者", "text": "商号（名称）\n代表者　印\n主たる事務所の所在地\n免許証番号", "inputs": ["商号（名称）", "代表者", "主たる事務所の所在地", "免許証番号"]}, {"no": "1", "label": "成約に向けての義務", "text": "一　乙は、契約の相手方を探索するとともに、契約の相手方との契約条件の調整等を行い、契約の成立に向けて積極的に努力します。\n二　乙は、甲に対し、＊１＿＿＿＿により、＊２＿＿＿＿回以上の頻度で業務の処理状況を報告します。\n三　乙は、目的物件の売買又は交換の申込みがあったときは、甲に対し、遅滞なく、その旨を報告します。\n四　乙は、広く契約の相手方を探索するため、目的物件につき、所在地、規模、形質、媒介価額その他の事項を、＊３＿＿＿＿にこの媒介契約の締結の日の翌日から＊４＿＿＿＿日以内（乙の休業日を含みません。）に登録します。また、目的物件を登録したときは、遅滞なく、甲に対して宅地建物取引業法第50条の６に定める登録を証する書面を交付（宅地建物取引業法第34条の２第12項の規定による提供を含みます。）します。\nなお、乙は、目的物件の売買又は交換の契約が成立したときは、宅地建物取引業法第34条の２第７項に基づき当該契約に関する情報を指定流通機構に通知し、当該契約に関する情報は、当該指定流通機構から宅地建物取引業者に提供されるなど、宅地建物取引業法第50条の３及び第50条の７に定める指定流通機構の業務のために利用されます。\n備考\n＊１　文書又は電子メールのうちいずれかの方法を選択して記入すること。\n＊２　宅地建物取引業法第34条の２第９項に定める頻度（２週間に１回以上）の範囲内で具体的な頻度を記入すること。\n＊３　当該目的物件の所在地を含む地域を対象として登録業務を行っている指定流通機構の名称を記入すること。\n＊４　宅地建物取引業法第34条の２第５項及び宅地建物取引業法施行規則第15条の10に定める期間（７日以内）の範囲内で具体的な期間を記入すること。", "inputs": ["＊１ 業務処理状況の報告方法（文書／電子メール）", "＊２ 報告頻度（２週間に１回以上の範囲内）", "＊３ 指定流通機構の名称", "＊４ 登録期限（７日以内の範囲内）"]}, {"no": "2", "label": "媒介に係る業務", "text": "乙は、１に掲げる業務を履行するとともに、次の業務を行います。\n一　乙は、甲に対し、目的物件を売買すべき価額又は評価額について意見を述べるときは、その根拠を明らかにして説明を行います。\n二　甲が乙に目的物件の購入又は取得を依頼した場合にあっては、乙は、甲に対し、目的物件の売買又は交換の契約が成立するまでの間に、宅地建物取引士をして、宅地建物取引業法第35条に定める重要事項について、宅地建物取引士が記名した書面を交付（宅地建物取引業法第35条第８項又は第９項の規定による提供を含みます。）して説明させます。\n三　乙は、目的物件の売買又は交換の契約が成立したときは、甲及び甲の相手方に対し、遅滞なく、宅地建物取引業法第37条に定める書面を作成し、宅地建物取引士に当該書面に記名させた上で、これを交付（宅地建物取引業法第37条第４項の規定による提供を含みます。）します。\n四　乙は、甲に対し、登記、決済手続等の目的物件の引渡しに係る事務の補助を行います。\n五　その他（＿＿＿＿）", "inputs": ["五 その他（自由記載）"]}, {"no": "3", "label": "建物状況調査を実施する者のあっせんの有無", "text": "（有・無）　＊＿＿＿＿\n＊　目的物件が既存の住宅である場合において、あっせん「無」とするときは、その理由を記入すること。\n注　建物状況調査の結果は瑕疵の有無を判定するものではなく、瑕疵がないことを保証するものでもありませんが、住宅の品質に関する情報を提供することにより、売主・買主が安心して取引ができるよう、目的物件について、目視を中心とした非破壊調査により、劣化事象等の状況を把握し、明らかにするものです。", "inputs": ["有・無の選択", "＊ 既存住宅で「無」とする場合の理由"]}, {"no": "4", "label": "違約金等", "text": "一　甲がこの媒介契約の有効期間内に乙以外の宅地建物取引業者に目的物件の売買又は交換の媒介又は代理を依頼し、これによって売買又は交換の契約を成立させたときは、乙は、甲に対して、約定報酬額に相当する金額（この媒介に係る消費税額及び地方消費税額の合計額に相当する額を除きます。）を違約金として請求することができます。\n二　この媒介契約の有効期間内において、甲が自ら発見した相手方と目的物件の売買若しくは交換の契約を締結したとき、又は乙の責めに帰すことができない事由によってこの媒介契約が解除されたときは、乙は、甲に対して、この媒介契約の履行のために要した費用の償還を請求することができます。"}, {"no": "5", "label": "有効期間", "text": "この媒介契約締結後＿＿＿＿ヶ月（　年　月　日まで）とします。", "inputs": ["月数", "満了日（年月日）"]}, {"no": "6", "label": "約定報酬額", "text": "＿＿＿＿円と＿＿＿＿円を合計した額とします。\n（欄上の注記）（消費税及び地方消費税抜き報酬額）　（消費税額及び地方消費税額の合計額）", "inputs": ["消費税及び地方消費税抜き報酬額（円）", "消費税額及び地方消費税額の合計額（円）"]}, {"no": "7", "label": "約定報酬の受領の時期", "text": "＿＿＿＿とします。", "inputs": ["受領の時期"]}, {"label": "別表（目的物件の表示）", "layout_note": "原本は表組み。以下は欄の構成を上から順に列挙したもの（欄内の固定文字のみ。＿＿は記入欄）。", "sections": [{"name": "所有者", "fields": ["住　所", "氏　名"]}, {"name": "登記名義人", "fields": ["住　所", "氏　名"]}, {"name": "所在地", "fields": ["所在地"]}, {"name": "目的物件の表示／土地", "fields": ["実　測（㎡）", "公　簿（㎡）", "地目：宅地・田・畑・山林・雑種地・その他（　）", "権利内容：所有権・借地権"]}, {"name": "目的物件の表示／建物", "fields": ["建築面積（㎡）", "延面積（㎡）", "種類", "構造：＿＿造　＿＿葺　＿＿階建", "間取り"]}, {"name": "目的物件の表示／マンション", "fields": ["名称：＿＿　＿＿階　＿＿号室", "構造：＿＿造　＿＿階建", "タイプ：＿＿ＬＤＫ　＿＿ＤＫ", "専有面積（㎡）", "共有持分：＿＿分の＿＿"]}, {"name": "媒介価額", "fields": ["本体価額（円）", "消費税額及び地方消費税額の合計額（円）", "媒介価額　総額（円）"]}, {"name": "備考", "fields": ["備　考"]}], "buy_request_alternative": {"lead": "［ただし、買い依頼に係る媒介契約については、次の別表を使用することとして差し支えない。］", "title": "希望する条件", "columns": ["項　目", "内　容", "希　望　の　程　度"], "rows": ["物件の種類", "価　額", "広さ・間取り等", "物件の所在地"], "other": "その他の条件（希望の程度もお書き下さい。）", "note": "注　「希望の程度」の欄には、「特に強い」、「やや強い」、「普通」等と記入すること。"}}], "articles": [{"no": "第1条", "title": "（目的）", "text": "この約款は、宅地又は建物の売買又は交換の専任媒介契約について、当事者が契約の締結に際して定めるべき事項及び当事者が契約の履行に関して互いに遵守すべき事項を明らかにすることを目的とします。"}, {"no": "第2条", "title": "（当事者の表示と用語の定義）", "text": "この約款においては、媒介契約の当事者について、依頼者を「甲」、依頼を受ける宅地建物取引業者を「乙」と表示します。\n２　この約款において、「専任媒介契約」とは、甲が依頼の目的である宅地又は建物（以下「目的物件」といいます。）の売買又は交換の媒介又は代理を乙以外の宅地建物取引業者に重ねて依頼することができないものとする媒介契約をいいます。"}, {"no": "第3条", "title": "（目的物件の表示等）", "text": "目的物件を特定するために必要な表示及び目的物件を売買すべき価額又は交換すべき評価額（以下「媒介価額」といいます。）は、専任媒介契約書の別表に記載します。"}, {"no": "第4条", "title": "（宅地建物取引業者の義務等）", "text": "乙は、次の事項を履行する義務を負います。\n一　契約の相手方を探索するとともに、契約の相手方との契約条件の調整等を行い、契約の成立に向けて積極的に努力すること。\n二　甲に対して、専任媒介契約書に記載する方法及び頻度により業務の処理状況を報告すること。\n三　目的物件の売買又は交換の申込みがあったときは、甲に対して、遅滞なく、その旨を報告すること。\n四　広く契約の相手方を探索するため、目的物件につき、所在地、規模、形質、媒介価額その他の事項を、専任媒介契約書に記載する指定流通機構に媒介契約の締結の日の翌日から専任媒介契約書に記載する期間内（乙の休業日を含みません。）に登録すること。\n五　前号の登録をしたときは、遅滞なく、指定流通機構が発行した宅地建物取引業法第50条の６に定める登録を証する書面を甲に対して交付（宅地建物取引業法第34条の２第12項の規定による提供を含みます。）すること。\n２　乙は、前項に掲げる義務を履行するとともに、次の業務を行います。\n一　媒介価額の決定に際し、甲に、その価額に関する意見を述べるときは、根拠を示して説明を行うこと。\n二　甲が乙に目的物件の購入又は取得を依頼した場合にあっては、甲に対して、目的物件の売買又は交換の契約が成立するまでの間に、宅地建物取引士をして、宅地建物取引業法第35条に定める重要事項について、宅地建物取引士が記名した書面を交付（宅地建物取引業法第35条第８項又は第９項の規定による提供を含みます。）して説明させること。\n三　目的物件の売買又は交換の契約が成立したときは、甲及び甲の相手方に対して、遅滞なく、宅地建物取引業法第37条に定める書面を作成し、宅地建物取引士に当該書面に記名させた上で、これを交付（宅地建物取引業法第37条第４項の規定による提供を含みます。）すること。\n四　甲に対して、登記、決済手続等の目的物件の引渡しに係る事務の補助を行うこと。\n五　その他専任媒介契約書に記載する業務を行うこと。"}, {"no": "第5条", "title": "（媒介価額の変更の助言等）", "text": "媒介価額が地価や物価の変動その他事情の変更によって不適当と認められるに至ったときは、乙は、甲に対して、媒介価額の変更について根拠を示して助言します。\n２　甲は、媒介価額を変更しようとするときは、乙にその旨を通知します。この場合において、価額の変更が引上げであるとき（甲が乙に目的物件の購入又は取得を依頼した場合にあっては、引下げであるとき）は、乙の承諾を要します。\n３　乙は、前項の承諾を拒否しようとするときは、その根拠を示さなければなりません。"}, {"no": "第6条", "title": "（建物状況調査を実施する者のあっせん）", "text": "乙は、この媒介契約において建物状況調査を実施する者のあっせんを行うこととした場合にあっては、甲に対して、建物状況調査を実施する者をあっせんしなければなりません。"}, {"no": "第7条", "title": "（有効期間）", "text": "専任媒介契約の有効期間は、３ケ月を超えない範囲で、甲乙協議の上、定めます。"}, {"no": "第8条", "title": "（報酬の請求）", "text": "乙の媒介によって目的物件の売買又は交換の契約が成立したときは、乙は、甲に対して、報酬を請求することができます。ただし、売買又は交換の契約が停止条件付契約として成立したときは、乙は、その条件が成就した場合にのみ報酬を請求することができます。\n２　前項の報酬の額は、国土交通省告示に定める限度額の範囲内で、甲乙協議の上、定めます。"}, {"no": "第9条", "title": "（報酬の受領の時期）", "text": "乙は、宅地建物取引業法第37条に定める書面を作成し、これを成立した契約の当事者に交付（宅地建物取引業法第37条第４項の規定による提供を含みます。）した後でなければ、前条第1項の報酬（以下「約定報酬」といいます。）を受領することができません。\n２　目的物件の売買又は交換の契約が、代金又は交換差金についての融資の不成立を解除条件として締結された後、融資の不成立が確定した場合、又は融資が不成立のときは甲が契約を解除できるものとして締結された後、融資の不成立が確定し、これを理由として甲が契約を解除した場合は、乙は、甲に、受領した約定報酬の全額を遅滞なく返還しなければなりません。ただし、これに対しては、利息は付さないこととします。"}, {"no": "第10条", "title": "（特別依頼に係る費用）", "text": "甲が乙に特別に依頼した広告の料金又は遠隔地への出張旅費は甲の負担とし、甲は、乙の請求に基づいて、その実費を支払わなければなりません。"}, {"no": "第11条", "title": "（直接取引）", "text": "専任媒介契約の有効期間内又は有効期間の満了後２年以内に、甲が乙の紹介によって知った相手方と乙を排除して目的物件の売買又は交換の契約を締結したときは、乙は、甲に対して、契約の成立に寄与した割合に応じた相当額の報酬を請求することができます。"}, {"no": "第12条", "title": "（違約金の請求）", "text": "甲は、専任媒介契約の有効期間内に、乙以外の宅地建物取引業者に目的物件の売買又は交換の媒介又は代理を依頼することはできません。甲がこれに違反し、売買又は交換の契約を成立させたときは、乙は、甲に対して、約定報酬額に相当する金額（この媒介に係る消費税額及び地方消費税額の合計額に相当する額を除きます。）の違約金の支払を請求することができます。"}, {"no": "第13条", "title": "（自ら発見した相手方と契約しようとする場合の通知）", "text": "甲は、専任媒介契約の有効期間内に、自ら発見した相手方と目的物件の売買又は交換の契約を締結しようとするときは、乙に対して、その旨を通知しなければなりません。"}, {"no": "第14条", "title": "（費用償還の請求）", "text": "専任媒介契約の有効期間内において、甲が自ら発見した相手方と目的物件の売買若しくは交換の契約を締結したとき、又は乙の責めに帰すことができない事由によって専任媒介契約が解除されたときは、乙は、甲に対して、専任媒介契約の履行のために要した費用の償還を請求することができます。\n２　前項の費用の額は、約定報酬額を超えることはできません。"}, {"no": "第15条", "title": "（更新）", "text": "専任媒介契約の有効期間は、甲及び乙の合意に基づき、更新することができます。\n２　有効期間の更新をしようとするときは、有効期間の満了に際して甲から乙に対し文書等でその旨を申し出るものとします。\n３　前２項の規定による有効期間の更新に当たり、甲乙間で専任媒介契約の内容について別段の合意がなされなかったときは、従前の契約と同一内容の契約が成立したものとみなします。"}, {"no": "第16条", "title": "（契約の解除）", "text": "甲又は乙が専任媒介契約に定める義務の履行に関してその本旨に従った履行をしない場合には、その相手方は、相当の期間を定めて履行を催告し、その期間内に履行がないときは、専任媒介契約を解除することができます。"}, {"no": "第17条", "title": "", "text": "次のいずれかに該当する場合においては、甲は、専任媒介契約を解除することができます。\n一　乙が専任媒介契約に係る業務について信義を旨とし誠実に遂行する義務に違反したとき。\n二　乙が専任媒介契約に係る重要な事項について故意若しくは重過失により事実を告げず、又は不実のことを告げる行為をしたとき。\n三　乙が宅地建物取引業に関して不正又は著しく不当な行為をしたとき。", "note": "原本に独自の見出しなし（直前条の（契約の解除）が共通見出し）"}, {"no": "第18条", "title": "（反社会的勢力の排除）", "text": "甲及び乙は、それぞれ相手方に対し、次の事項を確約します。\n一　自らが、暴力団、暴力団関係企業、総会屋若しくはこれらに準ずる者又はその構成員（以下これらを総称して「反社会的勢力」といいます。）でないこと。\n二　自らの役員（業務を執行する社員、取締役、執行役又はこれらに準ずる者をいいます。）が反社会的勢力でないこと。\n三　反社会的勢力に自己の名義を利用させ、専任媒介契約を締結するものでないこと。\n四　専任媒介契約の有効期間内に、自ら又は第三者を利用して、次の行為をしないこと。\nイ　相手方に対する脅迫的な言動又は暴力を用いる行為\nロ　偽計又は威力を用いて相手方の業務を妨害し、又は信用を毀損する行為\n２　専任媒介契約の有効期間内に、甲又は乙が次のいずれかに該当した場合には、その相手方は、何らの催告を要せずして、専任媒介契約を解除することができます。\n一　前項第１号又は第２号の確約に反する申告をしたことが判明した場合\n二　前項第３号の確約に反し契約をしたことが判明した場合\n三　前項第４号の確約に反する行為をした場合\n３　乙が前項の規定により専任媒介契約を解除したときは、甲に対して、約定報酬額に相当する金額（既に約定報酬の一部を受領している場合は、その額を除いた額とします。なお、この媒介に係る消費税額及び地方消費税額の合計額に相当する額を除きます。）を違約金として請求することができます。"}, {"no": "第19条", "title": "（特約）", "text": "この約款に定めがない事項については、甲及び乙が協議して別に定めることができます。\n２　この約款の各条項の定めに反する特約で甲に不利なものは無効とします。"}]}, "専属専任": {"source": "https://www.mlit.go.jp/totikensangyo/const/content/001723420.pdf", "notice": "平成2年建設省告示第115号（最終改正 令和6年1月24日国土交通省告示第34号）", "type": "専属専任媒介契約書", "form_fields": [{"label": "依頼の内容", "text": "売却・購入・交換", "input": "選択（売却・購入・交換）"}, {"label": "契約型式の説明（枠内固定文）", "text": "この契約は、次の３つの契約型式のうち、専属専任媒介契約型式です。\n・専属専任媒介契約型式\n依頼者は、目的物件の売買又は交換の媒介又は代理を、当社以外の宅地建物取引業者に重ねて依頼することができません。\n依頼者は、自ら発見した相手方と売買又は交換の契約を締結することができません。\n当社は、目的物件を国土交通大臣が指定した指定流通機構に登録します。\n・専任媒介契約型式\n依頼者は、目的物件の売買又は交換の媒介又は代理を、当社以外の宅地建物取引業者に重ねて依頼することができません。\n依頼者は、自ら発見した相手方と売買又は交換の契約を締結することができます。\n当社は、目的物件を国土交通大臣が指定した指定流通機構に登録します。\n・一般媒介契約型式\n依頼者は、目的物件の売買又は交換の媒介又は代理を、当社以外の宅地建物取引業者に重ねて依頼することができます。\n依頼者は、自ら発見した相手方と売買又は交換の契約を締結することができます。"}, {"label": "前文", "text": "依頼者甲は、この契約書及び専属専任媒介契約約款により、別表に表示する不動産（目的物件）に関する売買（交換）の媒介を宅地建物取引業者乙に依頼し、乙はこれを承諾します。"}, {"label": "締結日", "text": "年　月　日"}, {"label": "甲・依頼者", "text": "住所\n氏名", "inputs": ["住所", "氏名"]}, {"label": "乙・宅地建物取引業者", "text": "商号（名称）\n代表者　印\n主たる事務所の所在地\n免許証番号", "inputs": ["商号（名称）", "代表者", "主たる事務所の所在地", "免許証番号"]}, {"no": "1", "label": "成約に向けての義務", "text": "一　乙は、契約の相手方を探索するとともに、契約の相手方との契約条件の調整等を行い、契約の成立に向けて積極的に努力します。\n二　乙は、甲に対し、＊１＿＿＿＿により、＊２＿＿＿＿回以上の頻度で業務の処理状況を報告します。\n三　乙は、目的物件の売買又は交換の申込みがあったときは、甲に対し、遅滞なく、その旨を報告します。\n四　乙は、広く契約の相手方を探索するため、目的物件につき、所在地、規模、形質、媒介価額その他の事項を、＊３＿＿＿＿にこの媒介契約の締結の日の翌日から＊４＿＿＿＿日以内（乙の休業日を含みません。）に登録します。また、目的物件を登録したときは、遅滞なく、甲に対して宅地建物取引業法第50条の６に定める登録を証する書面を交付（宅地建物取引業法第34条の２第12項の規定による提供を含みます。）します。\nなお、乙は、目的物件の売買又は交換の契約が成立したときは、宅地建物取引業法第34条の２第７項に基づき当該契約に関する情報を指定流通機構に通知し、当該契約に関する情報は、当該指定流通機構から宅地建物取引業者に提供されるなど、宅地建物取引業法第50条の３及び第50条の７に定める指定流通機構の業務のために利用されます。\n備考\n＊１　文書又は電子メールのうちいずれかの方法を選択して記入すること。\n＊２　宅地建物取引業法第34条の２第９項に定める頻度（１週間に１回以上）の範囲内で具体的な頻度を記入すること。\n＊３　当該目的物件の所在地を含む地域を対象として登録業務を行っている指定流通機構の名称を記入すること。\n＊４　宅地建物取引業法第34条の２第５項及び宅地建物取引業法施行規則第15条の10に定める期間（５日以内）の範囲内で具体的な期間を記入すること。", "inputs": ["＊１ 業務処理状況の報告方法（文書／電子メール）", "＊２ 報告頻度（１週間に１回以上の範囲内）", "＊３ 指定流通機構の名称", "＊４ 登録期限（５日以内の範囲内）"]}, {"no": "2", "label": "媒介に係る業務", "text": "乙は、１に掲げる業務を履行するとともに、次の業務を行います。\n一　乙は、甲に対し、目的物件を売買すべき価額又は評価額について意見を述べるときは、その根拠を明らかにして説明を行います。\n二　甲が乙に目的物件の購入又は取得を依頼した場合にあっては、乙は、甲に対し、目的物件の売買又は交換の契約が成立するまでの間に、宅地建物取引士をして、宅地建物取引業法第35条に定める重要事項について、宅地建物取引士が記名した書面を交付（宅地建物取引業法第35条第８項又は第９項の規定による提供を含みます。）して説明させます。\n三　乙は、目的物件の売買又は交換の契約が成立したときは、甲及び甲の相手方に対し、遅滞なく、宅地建物取引業法第37条に定める書面を作成し、宅地建物取引士に当該書面に記名させた上で、これを交付（宅地建物取引業法第37条第４項の規定による提供を含みます。）します。\n四　乙は、甲に対し、登記、決済手続等の目的物件の引渡しに係る事務の補助を行います。\n五　その他（＿＿＿＿）", "inputs": ["五 その他（自由記載）"]}, {"no": "3", "label": "建物状況調査を実施する者のあっせんの有無", "text": "（有・無）　＊＿＿＿＿\n＊　目的物件が既存の住宅である場合において、あっせん「無」とするときは、その理由を記入すること。\n注　建物状況調査の結果は瑕疵の有無を判定するものではなく、瑕疵がないことを保証するものでもありませんが、住宅の品質に関する情報を提供することにより、売主・買主が安心して取引ができるよう、目的物件について、目視を中心とした非破壊調査により、劣化事象等の状況を把握し、明らかにするものです。", "inputs": ["有・無の選択", "＊ 既存住宅で「無」とする場合の理由"]}, {"no": "4", "label": "違約金等", "text": "一　甲がこの媒介契約の有効期間内に乙以外の宅地建物取引業者に目的物件の売買若しくは交換の媒介若しくは代理を依頼し、これによって売買若しくは交換の契約を成立させたとき、又は甲が自ら発見した相手方と目的物件の売買若しくは交換の契約を締結したときは、乙は、甲に対して、約定報酬額に相当する金額（この媒介に係る消費税額及び地方消費税額の合計額に相当する額を除きます。）を違約金として請求することができます。\n二　乙の責めに帰すことができない事由によってこの媒介契約が解除されたときは、乙は、甲に対して、この媒介契約の履行のために要した費用の償還を請求することができます。"}, {"no": "5", "label": "有効期間", "text": "この媒介契約締結後＿＿＿＿ヶ月（　年　月　日まで）とします。", "inputs": ["月数", "満了日（年月日）"]}, {"no": "6", "label": "約定報酬額", "text": "＿＿＿＿円と＿＿＿＿円を合計した額とします。\n（欄上の注記）（消費税及び地方消費税抜き報酬額）　（消費税額及び地方消費税額の合計額）", "inputs": ["消費税及び地方消費税抜き報酬額（円）", "消費税額及び地方消費税額の合計額（円）"]}, {"no": "7", "label": "約定報酬の受領の時期", "text": "＿＿＿＿とします。", "inputs": ["受領の時期"]}, {"label": "別表（目的物件の表示）", "layout_note": "原本は表組み。以下は欄の構成を上から順に列挙したもの（欄内の固定文字のみ。＿＿は記入欄）。", "sections": [{"name": "所有者", "fields": ["住　所", "氏　名"]}, {"name": "登記名義人", "fields": ["住　所", "氏　名"]}, {"name": "所在地", "fields": ["所在地"]}, {"name": "目的物件の表示／土地", "fields": ["実　測（㎡）", "公　簿（㎡）", "地目：宅地・田・畑・山林・雑種地・その他（　）", "権利内容：所有権・借地権"]}, {"name": "目的物件の表示／建物", "fields": ["建築面積（㎡）", "延面積（㎡）", "種類", "構造：＿＿造　＿＿葺　＿＿階建", "間取り"]}, {"name": "目的物件の表示／マンション", "fields": ["名称：＿＿　＿＿階　＿＿号室", "構造：＿＿造　＿＿階建", "タイプ：＿＿ＬＤＫ　＿＿ＤＫ", "専有面積（㎡）", "共有持分：＿＿分の＿＿"]}, {"name": "媒介価額", "fields": ["本体価額（円）", "消費税額及び地方消費税額の合計額（円）", "媒介価額　総額（円）"]}, {"name": "備考", "fields": ["備　考"]}], "buy_request_alternative": {"lead": "［ただし、買い依頼に係る媒介契約については、次の別表を使用することとして差し支えない。］", "title": "希望する条件", "columns": ["項　目", "内　容", "希　望　の　程　度"], "rows": ["物件の種類", "価　額", "広さ・間取り等", "物件の所在地"], "other": "その他の条件（希望の程度もお書き下さい。）", "note": "注　「希望の程度」の欄には、「特に強い」、「やや強い」、「普通」等と記入すること。"}}], "articles": [{"no": "第1条", "title": "（目的）", "text": "この約款は、宅地又は建物の売買又は交換の専属専任媒介契約について、当事者が契約の締結に際して定めるべき事項及び当事者が契約の履行に関して互いに遵守すべき事項を明らかにすることを目的とします。"}, {"no": "第2条", "title": "（当事者の表示と用語の定義）", "text": "この約款においては、媒介契約の当事者について、依頼者を「甲」、依頼を受ける宅地建物取引業者を「乙」と表示します。\n２　この約款において、「専属専任媒介契約」とは、甲が依頼の目的である宅地又は建物（以下「目的物件」といいます。）の売買又は交換の媒介又は代理を乙以外の宅地建物取引業者に重ねて依頼することができず、かつ、甲が自ら発見した相手方と目的物件の売買又は交換の契約を締結することができないものとする媒介契約をいいます。"}, {"no": "第3条", "title": "（目的物件の表示等）", "text": "目的物件を特定するために必要な表示及び目的物件を売買すべき価額又は交換すべき評価額（以下「媒介価額」といいます。）は、専属専任媒介契約書の別表に記載します。"}, {"no": "第4条", "title": "（宅地建物取引業者の義務等）", "text": "乙は、次の事項を履行する義務を負います。\n一　契約の相手方を探索するとともに、契約の相手方との契約条件の調整等を行い、契約の成立に向けて積極的に努力すること。\n二　甲に対して、専属専任媒介契約書に記載する方法及び頻度により業務の処理状況を報告すること。\n三　目的物件の売買又は交換の申込みがあったときは、甲に対して、遅滞なく、その旨を報告すること。\n四　広く契約の相手方を探索するため、目的物件につき、所在地、規模、形質、媒介価額その他の事項を、専属専任媒介契約書に記載する指定流通機構に媒介契約の締結の日の翌日から専属専任媒介契約書に記載する期間内（乙の休業日を含みません。）に登録すること。\n五　前号の登録をしたときは、遅滞なく、指定流通機構が発行した宅地建物取引業法第50条の６に定める登録を証する書面を甲に対して交付（宅地建物取引業法第34条の２第12項の規定による提供を含みます。）すること。\n２　乙は、前項に掲げる義務を履行するとともに、次の業務を行います。\n一　媒介価額の決定に際し、甲に、その価額に関する意見を述べるときは、根拠を示して説明を行うこと。\n二　甲が乙に目的物件の購入又は取得を依頼した場合にあっては、甲に対して、目的物件の売買又は交換の契約が成立するまでの間に、宅地建物取引士をして、宅地建物取引業法第35条に定める重要事項について、宅地建物取引士が記名した書面を交付（宅地建物取引業法第35条第８項又は第９項の規定による提供を含みます。）して説明させること。\n三　目的物件の売買又は交換の契約が成立したときは、甲及び甲の相手方に対して、遅滞なく、宅地建物取引業法第37条に定める書面を作成し、宅地建物取引士に当該書面に記名させた上で、これを交付（宅地建物取引業法第37条第４項の規定による提供を含みます。）すること。\n四　甲に対して、登記、決済手続等の目的物件の引渡しに係る事務の補助を行うこと。\n五　その他専属専任媒介契約書に記載する業務を行うこと。"}, {"no": "第5条", "title": "（媒介価額の変更の助言等）", "text": "媒介価額が地価や物価の変動その他事情の変更によって不適当と認められるに至ったときは、乙は、甲に対して、媒介価額の変更について根拠を示して助言します。\n２　甲は、媒介価額を変更しようとするときは、乙にその旨を通知します。この場合において、価額の変更が引上げであるとき（甲が乙に目的物件の購入又は取得を依頼した場合にあっては、引下げであるとき）は、乙の承諾を要します。\n３　乙は、前項の承諾を拒否しようとするときは、その根拠を示さなければなりません。"}, {"no": "第6条", "title": "（建物状況調査を実施する者のあっせん）", "text": "乙は、この媒介契約において建物状況調査を実施する者のあっせんを行うこととした場合にあっては、甲に対して、建物状況調査を実施する者をあっせんしなければなりません。"}, {"no": "第7条", "title": "（有効期間）", "text": "専属専任媒介契約の有効期間は、３ヶ月を超えない範囲で、甲乙協議の上、定めます。"}, {"no": "第8条", "title": "（報酬の請求）", "text": "乙の媒介によって目的物件の売買又は交換の契約が成立したときは、乙は、甲に対して、報酬を請求することができます。ただし、売買又は交換の契約が停止条件付契約として成立したときは、乙は、その条件が成就した場合にのみ報酬を請求することができます。\n２　前項の報酬の額は、国土交通省告示に定める限度額の範囲内で、甲乙協議の上、定めます。"}, {"no": "第9条", "title": "（報酬の受領の時期）", "text": "乙は、宅地建物取引業法第37条に定める書面を作成し、これを成立した契約の当事者に交付（宅地建物取引業法第37条第４項の規定による提供を含みます。）した後でなければ、前条第１項の報酬（以下「約定報酬」といいます。）を受領することができません。\n２　目的物件の売買又は交換の契約が、代金又は交換差金についての融資の不成立を解除条件として締結された後、融資の不成立が確定した場合、又は融資が不成立のときは甲が契約を解除できるものとして締結された後、融資の不成立が確定し、これを理由として甲が契約を解除した場合は、乙は、甲に、受領した約定報酬の全額を遅滞なく返還しなければなりません。ただし、これに対しては、利息は付さないこととします。"}, {"no": "第10条", "title": "（特別依頼に係る費用）", "text": "甲が乙に特別に依頼した広告の料金又は遠隔地への出張旅費は甲の負担とし、甲は、乙の請求に基づいて、その実費を支払わなければなりません。"}, {"no": "第11条", "title": "（直接取引）", "text": "専属専任媒介契約の有効期間の満了後２年以内に、甲が乙の紹介によって知った相手方と乙を排除して目的物件の売買又は交換の契約を締結したときは、乙は、甲に対して、契約の成立に寄与した割合に応じた相当額の報酬を請求することができます。"}, {"no": "第12条", "title": "（違約金の請求）", "text": "甲は、専属専任媒介契約の有効期間内に、乙以外の宅地建物取引業者に目的物件の売買又は交換の媒介又は代理を依頼することはできません。甲がこれに違反し、売買又は交換の契約を成立させたときは、乙は、甲に対して、約定報酬額に相当する金額（この媒介に係る消費税額及び地方消費税額の合計額に相当する額を除きます。）の違約金の支払を請求することができます。\n２　甲は、専属専任媒介契約の有効期間内に、自ら発見した相手方と目的物件の売買又は交換の契約を締結することはできません。甲がこれに違反したときは、乙は、甲に対して、約定報酬額に相当する金額（この媒介に係る消費税額及び地方消費税額の合計額に相当する額を除きます。）の違約金の支払を請求することができます。"}, {"no": "第13条", "title": "（費用償還の請求）", "text": "専属専任媒介契約の有効期間内において、乙の責めに帰すことができない事由によって専属専任媒介契約が解除されたときは、乙は、甲に対して、専属専任媒介契約の履行のために要した費用の償還を請求することができます。\n２　前項の費用の額は、約定報酬額を超えることはできません。"}, {"no": "第14条", "title": "（更新）", "text": "専属専任媒介契約の有効期間は、甲及び乙の合意に基づき、更新することができます。\n２　有効期間の更新をしようとするときは、有効期間の満了に際して甲から乙に対し文書等でその旨を申し出るものとします。\n３　前２項の規定による有効期間の更新に当たり、甲乙間で専属専任媒介契約の内容について別段の合意がなされなかったときは、従前の契約と同一内容の契約が成立したものとみなします。"}, {"no": "第15条", "title": "（契約の解除）", "text": "甲又は乙が専属専任媒介契約に定める義務の履行に関してその本旨に従った履行をしない場合には、その相手方は、相当の期間を定めて履行を催告し、その期間内に履行がないときは、専属専任媒介契約を解除することができます。"}, {"no": "第16条", "title": "", "text": "次のいずれかに該当する場合においては、甲は、専属専任媒介契約を解除することができます。\n一　乙が専属専任媒介契約に係る業務について信義を旨とし誠実に遂行する義務に違反したとき。\n二　乙が専属専任媒介契約に係る重要な事項について故意若しくは重過失により事実を告げず、又は不実のことを告げる行為をしたとき。\n三　乙が宅地建物取引業に関して不正又は著しく不当な行為をしたとき。", "note": "原本に独自の見出しなし（直前条の（契約の解除）が共通見出し）"}, {"no": "第17条", "title": "（反社会的勢力の排除）", "text": "甲及び乙は、それぞれ相手方に対し、次の事項を確約します。\n一　自らが、暴力団、暴力団関係企業、総会屋若しくはこれらに準ずる者又はその構成員（以下これらを総称して「反社会的勢力」といいます。）でないこと。\n二　自らの役員（業務を執行する社員、取締役、執行役又はこれらに準ずる者をいいます。）が反社会的勢力でないこと。\n三　反社会的勢力に自己の名義を利用させ、専属専任媒介契約を締結するものでないこと。\n四　専属専任媒介契約の有効期間内に、自ら又は第三者を利用して、次の行為をしないこと。\nイ　相手方に対する脅迫的な言動又は暴力を用いる行為\nロ　偽計又は威力を用いて相手方の業務を妨害し、又は信用を毀損する行為\n２　専属専任媒介契約の有効期間内に、甲又は乙が次のいずれかに該当した場合には、その相手方は、何らの催告を要せずして、専属専任媒介契約を解除することができます。\n一　前項第１号又は第２号の確約に反する申告をしたことが判明した場合\n二　前項第３号の確約に反し契約をしたことが判明した場合\n三　前項第４号の確約に反する行為をした場合\n３　乙が前項の規定により専属専任媒介契約を解除したときは、甲に対して、約定報酬額に相当する金額（既に約定報酬の一部を受領している場合は、その額を除いた額とします。なお、この媒介に係る消費税額及び地方消費税額の合計額に相当する額を除きます。）を違約金として請求することができます。"}, {"no": "第18条", "title": "（特約）", "text": "この約款に定めがない事項については、甲及び乙が協議して別に定めることができます。\n２　この約款の各条項の定めに反する特約で甲に不利なものは無効とします。"}]}};</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BL='＿＿＿＿',KEY='misaneco_baikai_v1';
const zen=s=>String(s).replace(/[0-9]/g,d=>String.fromCharCode(d.charCodeAt(0)+0xFEE0));
const yen=n=>(n===''||n==null||isNaN(n))?'':Number(n).toLocaleString('ja-JP');
let type='専任',st={};
function D(){return DATA[type]}
function ffIndex(label){return D().form_fields.findIndex(f=>f.label===label)}
// 入力欄：各フォーム欄の空欄（＿＿＿＿）ごとに入力を作る
function blanks(f){return (f.text||'').split(BL).length-1}
function key(fi,k){return type+'|'+fi+'|'+k}
function v(fi,k){return st[key(fi,k)]??''}
function setv(fi,k,val){st[key(fi,k)]=val;save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify({type,st}))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o){type=o.type||type;st=o.st||{}}}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wa(iso){if(!iso)return '　　年　　月　　日';const [y,m,d]=iso.split('-').map(Number);return `${y}年${m}月${d}日`}
function edateMinus1(iso,months){if(!iso||!months)return '';const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1+Number(months),d);if(t.getDate()!==d)t.setDate(0);t.setDate(t.getDate()-1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function feeCap(p,akiya){p=Number(p)||0;let f=Math.min(p,2e6)*0.05+Math.max(0,Math.min(p,4e6)-2e6)*0.04+Math.max(0,p-4e6)*0.03;f=Math.floor(f);if(akiya&&p<=8e6)f=Math.max(f,300000);return f}
// ---- 入力フォーム
function input(fi,k,label,opts={}){
  const val=v(fi,k);let h;
  if(opts.select)h=`<select data-fi="${fi}" data-k="${k}">${['',...opts.select].map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(opts.area)h=`<textarea data-fi="${fi}" data-k="${k}" rows="3">${esc(val)}</textarea>`;
  else h=`<input type="${opts.type||'text'}" data-fi="${fi}" data-k="${k}" value="${esc(val)}" placeholder="${esc(opts.ph||'')}">`;
  return `<label class="f"><span>${esc(label)}</span>${h}${opts.help?`<small>${esc(opts.help)}</small>`:''}</label>`;
}
const SEL={'依頼の内容':['売却','購入','交換']};
function renderForm(){
  const d=D();let h='';
  d.form_fields.forEach((f,fi)=>{
    if(f.label==='契約型式の説明（枠内固定文）'||f.label==='前文')return;
    if(f.sections){h+=`<fieldset><legend>別表（目的物件の表示）</legend>`;
      f.sections.forEach((s,si)=>{h+=`<div class="sec"><b>${esc(s.name)}</b>`;s.fields.forEach((x,xi)=>{const n=Math.max(1,x.split('＿＿').length-1);for(let j=0;j<n;j++){const lab=x.replace(/＿＿/g,'□')+(n>1?`（${j+1}つめの□）`:'');h+=input(fi,`s${si}_${xi}_${j}`,lab)}});h+='</div>'});
      h+=`</fieldset>`;return}
    h+=`<fieldset><legend>${f.no?esc(f.no)+'　':''}${esc(f.label)}</legend>`;
    if(f.label==='依頼の内容')h+=input(fi,'sel','選んでください',{select:SEL['依頼の内容']});
    else if(f.label==='締結日')h+=input(fi,'date','締結日',{type:'date'});
    else{
      if(/（有・無）/.test(f.text))h+=input(fi,'umu','有・無',{select:['有','無']});
      const n=blanks(f);
      if(f.label==='有効期間'){h+=input(fi,'b0','月数（専任・専属専任は３か月以内）',{type:'number',ph:'3'});h+=`<div class="note" id="mankyo"></div>`}
      else if(f.label==='約定報酬額'){h+=input(fi,'b0','税抜の報酬額（円）',{type:'number'});h+=input(fi,'b1','消費税額等（円）',{type:'number'});h+=`<button class="sub" id="feeauto">媒介価額から上限で入れる</button><label class="rb"><input type="checkbox" id="akiya"${st[type+'|akiya']?' checked':''}> 低廉な空家等の特例（800万円以下・事前に説明と合意が必要）</label><div class="note" id="feenote"></div>`}
      else{const labs=(f.inputs||[]).filter(x=>!/有・無の選択/.test(x));for(let j=0;j<n;j++)h+=input(fi,'b'+j,labs[j]||`記入欄${j+1}`,{area:f.label==='特約事項'})}
      if(f.label==='特約事項')h+=input(fi,'b0','特約事項',{area:true});
      if(f.inputs&&f.inputs.length&&n===0&&!/有・無/.test(f.text)&&f.label!=='特約事項'){f.inputs.forEach((lab,j)=>h+=input(fi,'i'+j,lab))}
    }
    h+=`</fieldset>`;
  });
  $('#form').innerHTML=h;
  $('#form').querySelectorAll('[data-fi]').forEach(e=>e.oninput=e.onchange=()=>{setv(e.dataset.fi,e.dataset.k,e.value);update()});
  const fb=$('#feeauto');if(fb)fb.onclick=e=>{e.preventDefault();const p=price();if(!p){alertBox('先に別表の「媒介価額 本体価額」を入れてください');return}const fi=ffIndex('約定報酬額');const cap=feeCap(p,$('#akiya').checked);setv(fi,'b0',String(cap));setv(fi,'b1',String(Math.floor(cap*0.1)));renderForm();update()};
  const ak=$('#akiya');if(ak)ak.onchange=()=>{st[type+'|akiya']=ak.checked;save();update()};
}
function alertBox(m){$('#msg').textContent=m;setTimeout(()=>{if($('#msg').textContent===m)$('#msg').textContent=''},5000)}
function bt(){return D().form_fields.findIndex(f=>f.sections)}
function sv(name,field,j=0){const f=D().form_fields[bt()];const si=f.sections.findIndex(s=>s.name===name);const xi=f.sections[si].fields.findIndex(x=>x.startsWith(field));return v(bt(),`s${si}_${xi}_${j}`)}
function price(){return Number(String(sv('媒介価額','本体価額')).replace(/[,，円]/g,''))||0}
// ---- チェック
function checks(){
  const out=[];const d=D();const sen=type!=='一般';
  const date=v(ffIndex('締結日'),'date');
  const yu=ffIndex('有効期間');const mon=Number(v(yu,'b0'));
  if(!date)out.push(['warn','締結日が入っていません']);
  if(mon){if(mon>3)out.push(['err',sen?'有効期間は３か月以内です（宅建業法34条の2第3項）':'一般媒介でも標準媒介契約約款では有効期間は３か月以内です']);}
  else out.push(['warn','有効期間の月数が入っていません']);
  if(sen){const g=d.form_fields[ffIndex('成約に向けての義務')];const fi=ffIndex('成約に向けての義務');
    const days=Number(String(v(fi,'b3')).replace(/[^0-9０-９]/g,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)));const lim=type==='専属専任'?5:7;
    if(!v(fi,'b0'))out.push(['warn','＊１ 報告の方法（文書又は電子メール）を入れてください']);
    if(!v(fi,'b1'))out.push(['warn',`＊２ 報告の頻度を入れてください（${type==='専属専任'?'１週間':'２週間'}に１回以上）`]);
    if(!v(fi,'b2'))out.push(['warn','＊３ 指定流通機構の名称を入れてください']);
    if(!days)out.push(['warn',`＊４ 登録の期限（${lim}日以内）を入れてください`]);else if(days>lim)out.push(['err',`＊４ 登録の期限は${lim}日以内です（施行規則15条の10）`]);}
  const fi=ffIndex('約定報酬額');const fee=Number(v(fi,'b0'))||0,tax=Number(v(fi,'b1'))||0;const p=price();
  if(p&&fee){const cap=feeCap(p,$('#akiya')?.checked);if(fee>cap)out.push(['err',`税抜の報酬額 ${yen(fee)}円 が上限 ${yen(cap)}円 を超えています（報酬告示）`]);}
  if(fee&&tax&&Math.abs(tax-Math.floor(fee*0.1))>1)out.push(['warn',`消費税額等が税抜の10%（${yen(Math.floor(fee*0.1))}円）と違います。確認してください`]);
  const ar=ffIndex('建物状況調査を実施する者のあっせんの有無');if(v(ar,'umu')==='無'&&!v(ar,'b0'))out.push(['warn','建物状況調査のあっせんを「無」にする場合で既存の住宅のときは、理由を記入します']);
  if(!v(ffIndex('約定報酬の受領の時期'),'b0'))out.push(['warn','約定報酬の受領の時期を入れてください']);
  return out;
}
// ---- 書面
function fill(text,fi,umuKey){
  let k=0;let t=esc(text);
  t=t.replace(/＿＿＿＿/g,()=>{const val=v(fi,'b'+(k++));return val?`<u class="fv">${esc(val)}</u>`:'<span class="blank">　　　　　　</span>'});
  t=t.replace(/(＊[１-９]?)(<u)/g,'$1 $2');
  if(umuKey){const u=v(fi,'umu');if(u)t=t.replace('（有・無）',u==='有'?'（<span class="maru">有</span>・無）':'（有・<span class="maru">無</span>）')}
  return t.replace(/\n/g,'<br>');
}
function doc(){

  d.form_fields.forEach((f,fi)=>{
    if(f.label==='依頼の内容'){const s=v(fi,'sel');h+=`<p class="center">依頼の内容　${['売却','購入','交換'].map(x=>x===s?`<span class="maru">${x}</span>`:x).join('・')}</p>`;return}
    if(f.label==='契約型式の説明（枠内固定文）'){h+=`<div class="box">${esc(f.text).replace(/\n/g,'<br>')}</div>`;return}
    if(f.label==='前文'){h+=`<p>${esc(f.text)}</p>`;return}

    if(f.sections){h+=`</div><div class="page"><h2>別表</h2><table class="bt">`;
      f.sections.forEach((s,si)=>{h+=`<tr><th>${esc(s.name)}</th><td>`+s.fields.map((x,xi)=>{let j=0;const n=x.split('＿＿').length-1;let t=n?esc(x).replace(/＿＿/g,()=>{const val=v(fi,`s${si}_${xi}_${j++}`);return val?`<u class="fv">${esc(val)}</u>`:'<span class="blank">　　　</span>'}):esc(x)+'　'+(v(fi,`s${si}_${xi}_0`)?`<u class="fv">${esc(v(fi,`s${si}_${xi}_0`))}</u>`:'');return t}).join('<br>')+`</td></tr>`});
      h+=`</table>`;return}
    if(f.label==='有効期間'){const m=v(fi,'b0');const date=v(ffIndex('締結日'),'date');const end=edateMinus1(date,m);h+=`<h3>${esc(f.no)}　${esc(f.label)}</h3><p>この媒介契約締結後${m?`<u class="fv">${zen(m)}</u>`:'<span class="blank">　　</span>'}ヶ月（${wa(end)}まで）とします。</p>`;return}
    if(f.label==='特約事項'){h+=`<h3>${esc(f.no)}　${esc(f.label)}</h3><p>${esc(v(fi,'b0')).replace(/\n/g,'<br>')||'　'}</p>`;return}
    if(f.label==='依頼する乙以外の宅地建物取引業者'){h+=`<h3>${esc(f.no)}　${esc(f.label)}</h3><p>（商号又は名称）${esc(v(fi,'i0'))}　（主たる事務所の所在地）${esc(v(fi,'i1'))}</p>`;return}
    let t=f.text;if(f.label==='約定報酬額'){const a=v(fi,'b0'),b=v(fi,'b1');t=t.replace('＿＿＿＿',yen(a)||'＿＿＿＿').replace('＿＿＿＿',yen(b)||'＿＿＿＿');st[key(fi,'b0x')]=1}
    h+=`<h3>${f.no?esc(f.no)+'　':''}${esc(f.label)}</h3><p>${f.label==='約定報酬額'?esc(t).replace(/\n/g,'<br>'):fill(t,fi,true)}</p>`;
  });
  h+=`</div><div class="page"><h1>${esc(type)}媒介契約約款</h1>`;
  d.articles.forEach(a=>{h+=`<h3>${esc(a.no)}${esc(a.title||'')}</h3><p>${esc(a.text).replace(/\n/g,'<br>')}</p>`});
  h+=`<p class="src">（${esc(d.notice)}）</p></div>`;
  return h;
}
function update(){
  const c=checks();$('#chk').innerHTML=c.length?c.map(([k,m])=>`<li class="${k}">${k==='err'?'エラー':'確認'}：${esc(m)}</li>`).join(''):'<li class="ok">チェック項目はすべて入っています</li>';
  const yu=ffIndex('有効期間');const m=$('#mankyo');if(m){const end=edateMinus1(v(ffIndex('締結日'),'date'),v(yu,'b0'));m.textContent=end?`満了日：${wa(end)}（締結日から${v(yu,'b0')}か月後の前日）`:''}
  const fn=$('#feenote');if(fn){const p=price();fn.textContent=p?`媒介価額 ${yen(p)}円 → 上限（税抜）${yen(feeCap(p,$('#akiya').checked))}円`:'別表の媒介価額（本体価額）を入れると上限を計算します'}
  $('#doc').innerHTML=doc();
}
function setType(t){type=t;document.querySelectorAll('.tp').forEach(b=>b.classList.toggle('on',b.dataset.t===t));save();renderForm();update()}
